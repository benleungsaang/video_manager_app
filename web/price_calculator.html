        }
      }

      // 选择内置货币
      function selectCurrency(code, rate) {
        // 填充币种代码和汇率输入框
        document.getElementById("currencyCodeInput").value = code;
        document.getElementById("exchangeRateInput").value = rate;

        // 应用汇率计算
        applyCurrencyRate(code, rate);
      }

      // 应用汇率计算
      function applyCurrencyRate(currencyCode, exchangeRate) {
        // 记录切换前的币种和汇率状态
        const previousCurrencyCode = window.currentCurrencyCode || "CNY";
        const previousExchangeRate = window.currentExchangeRate || 1.0;

        // 保存设置到全局变量
        window.currencyCode = currencyCode;
        window.exchangeRate = exchangeRate;
        window.showForeignCurrency = true; // 启用外币显示

        // 在更新当前汇率前，先对购物车中的项目进行汇率转换
        // 使用两步计算法：当前数值/当前汇率*新汇率
        // 实际上是：(当前数值/当前汇率)*新汇率
        cartItems.forEach((item) => {
          // 第一步：当前数值 / 当前汇率 = 基准数值
          const baseValue = item.actualPrice / previousExchangeRate;

          // 第二步：基准数值 * 新汇率 = 新数值
          item.actualPrice = baseValue * exchangeRate;

          // 保存基准价格（如果尚未保存）
          if (item.basePrice === undefined) {
            item.basePrice = item.actualPrice / exchangeRate; // 反算基准价格
          }
        });

        // 对临时费用项目也进行同样的转换
        tempItems.forEach((item) => {
          if (item.displayType === "费用") {
            // 第一步：当前数值 / 当前汇率 = 基准数值
            const baseValue = item.actualAmount / previousExchangeRate;

            // 第二步：基准数值 * 新汇率 = 新数值
            item.actualAmount = baseValue * exchangeRate;

            // 保存基准金额（如果尚未保存）
            if (item.baseAmount === undefined) {
              item.baseAmount = item.actualAmount / exchangeRate; // 反算基准金额
            }
          }
        });

        // 保存当前币种状态（已经更新了项目价格）
        window.currentCurrencyCode = currencyCode;
        window.currentExchangeRate = exchangeRate;

        // 保存切换前的币种和汇率，用于计算
        window.previousCurrencyCode = previousCurrencyCode;
        window.previousExchangeRate = previousExchangeRate;

        // 更新外币设置框标题
        updateCurrencySettingsTitle(currencyCode);

        // 重新生成报价单以反映更改
        generateQuote();
      }

      // 更新外币设置框标题
      function updateCurrencySettingsTitle(currencyCode) {
        const titleElement = document.getElementById("currencySettingsTitle");
        if (titleElement) {
          titleElement.textContent = `当前币种：${currencyCode}`;
        }
      }

      // 处理币种输入框回车事件
      function handleCurrencyInputKeyPress(event) {
        if (event.key === "Enter") {
          event.preventDefault(); // 阻止表单提交

          const currencyCode =
            document.getElementById("currencyCodeInput").value;
          const exchangeRate = parseFloat(
            document.getElementById("exchangeRateInput").value
          );

          if (currencyCode && exchangeRate) {
            applyCurrencyRate(currencyCode, exchangeRate);
          }
        }
      }

      // 处理币种输入框失焦事件
      function handleCurrencyInputBlur() {
        const currencyCode = document.getElementById("currencyCodeInput").value;
        const exchangeRate = parseFloat(
          document.getElementById("exchangeRateInput").value
        );

        if (currencyCode && exchangeRate) {
          applyCurrencyRate(currencyCode, exchangeRate);
        }
      }

      // 更新外币设置
      function updateCurrencySettings() {
        const currencyCode =
          document.getElementById("currencyCodeInput").value || "CNY";
        const exchangeRate =
          parseFloat(document.getElementById("exchangeRateInput").value) || 1.0;
        const showForeignCurrency = document.getElementById(
          "showForeignCurrencyCheckbox"
        ).checked;

        // 保存设置到全局变量
        window.currencyCode = currencyCode;
        window.exchangeRate = exchangeRate;
        window.showForeignCurrency = showForeignCurrency;

        // 重新生成报价单以反映更改
        generateQuote();
      }

      // 返回主页
      function backToMain() {
        document.querySelector(".container").style.display = "block";
        document.getElementById("quotePage").style.display = "none";
        currentView = "main";

        // 更新浮动按钮显示
        updateFloatingButtons();
      }

      // 切换单价显示
      function toggleShowUnitPrice() {
        window.currentShowUnitPrice = !window.currentShowUnitPrice;
        generateQuote(); // 重新生成报价单
      }

      // 返回购物车
      function backToCart() {
        document.querySelector(".container").style.display = "block";
        document.getElementById("quotePage").style.display = "none";
        showCart(); // 显示购物车模态框
        currentView = "cart";

        // 确保浮动按钮显示正确
        updateFloatingButtons();
      }

      // 清空购物车确认
      function clearCartConfirmation() {
        if (confirm("确定要清空购物车吗？")) {
          clearCart();
        }
      }

      // 清空购物车
      function clearCart() {
        cartItems = [];
        tempItems = [];
        renderCart();
        updateCartCount();
        updateCartSummary();
        showMessage("购物车已清空", "success");
      }

      // 格式化金额（每三位添加逗号）
      function formatCurrency(amount) {
        return parseFloat(amount).toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      // 更新浮动按钮显示状态
      function updateFloatingButtons() {
        // 获取浮动按钮元素
        const allFloatingCarts = document.querySelectorAll(".floating-cart");
        const clearCartBtn = document.getElementById("clearCartBtn");
        const quoteButtons = document.querySelector(".floating-quote-buttons");

        // 分别处理普通购物车按钮和清空购物车按钮
        allFloatingCarts.forEach((btn) => {
          if (btn.id !== "clearCartBtn") {
            // 普通购物车按钮
            if (currentView === "quote") {
              btn.style.display = "none";
            } else {
              // 在主页和购物车页面始终显示购物车按钮
              btn.style.display = currentView !== "quote" ? "flex" : "none";
            }
          }
        });

        if (currentView === "quote") {
          // 在报价单页面，隐藏清空购物车按钮
          if (clearCartBtn) clearCartBtn.style.display = "none";
          // 显示报价单按钮
          if (quoteButtons) quoteButtons.style.display = "flex";
        } else {
          // 在其他页面，显示清空购物车按钮（如果购物车有内容）
          if (clearCartBtn) {
            const cartCount = cartItems.reduce(
              (sum, item) => sum + item.quantity,
              0
            );
            clearCartBtn.style.display = cartCount > 0 ? "flex" : "none";
          }
          // 隐藏报价单按钮
          if (quoteButtons) quoteButtons.style.display = "none";
        }
      }

      // 更新购物车计数显示
      function updateCartCount() {
        const count = cartItems.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("cartItemCount").textContent = count;
        document.getElementById("floatingCartCount").textContent = count;

        // 控制清空购物车按钮的显示：只有在购物车有内容时才显示，并且不在报价单页面
        const clearCartBtn = document.getElementById("clearCartBtn");
        if (currentView !== "quote" && count > 0) {
          clearCartBtn.style.display = "flex";
        } else {
          clearCartBtn.style.display = "none";
        }

        updateCartSummary();

        // 更新浮动按钮显示
        updateFloatingButtons();
      }

      // 更新购物车摘要显示
      function updateCartSummary() {
        const cartSummary = document.getElementById("cartSummary");

        if (cartItems.length === 0 && tempItems.length === 0) {
          cartSummary.innerHTML =
            '<p style="text-align: center; color: #666;">购物车为空，请添加商品</p>';
          return;
        }

        let html = `
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background-color: #f2f2f2;">
                            <th style="border: 1px solid #ddd; padding: 10px; text-align: left;">型号</th>
                            <th style="border: 1px solid #ddd; padding: 10px; text-align: right;">单价</th>
                            <th style="border: 1px solid #ddd; padding: 10px; text-align: center;">数量</th>
                            <th style="border: 1px solid #ddd; padding: 10px; text-align: right;">小计</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

        // 显示购物车项目
        cartItems.forEach((item) => {
          const subtotal = item.actualPrice * item.quantity;
          html += `
                    <tr>
                        <td style="border: 1px solid #ddd; padding: 10px;">
                            <strong>${item.model}</strong>
                        </td>
                        <td style="border: 1px solid #ddd; padding: 10px; text-align: right;">${formatCurrency(
                          item.actualPrice
                        )}</td>
                        <td style="border: 1px solid #ddd; padding: 10px; text-align: center;">${
                          item.quantity
                        }</td>
                        <td style="border: 1px solid #ddd; padding: 10px; text-align: right;">${formatCurrency(
                          subtotal
                        )}</td>
                    </tr>
                `;
        });

        // 计算总计
        let baseTotal = cartItems.reduce(
          (sum, item) => sum + item.actualPrice * item.quantity,
          0
        );
        let tempFees = tempItems
          .filter((item) => item.displayType === "费用")
          .reduce((sum, item) => sum + item.actualAmount, 0);
        let factor = tempItems
          .filter((item) => item.displayType === "系数")
          .reduce((prod, item) => prod * item.value, 1);
        let total = (baseTotal + tempFees) * factor;

        html += `
                    </tbody>
                </table>

                <div style="margin-top: 15px; text-align: right; font-weight: bold;">
            `;

        // 只有在有购物车项目时才显示商品小计
        if (cartItems.length > 0) {
          html += `<div>商品小计: ${formatCurrency(baseTotal)}</div>`;
        } else if (tempItems.length > 0) {
          html += `<div>商品小计: ${formatCurrency(0)}</div>`; // 没有购物车项目时显示0
        }

        if (tempItems.length > 0) {
          // 先显示其它费用
          tempItems
            .filter((item) => item.displayType === "费用")
            .forEach((item) => {
              html += `<div>其它费用 (${item.name}): ${formatCurrency(
                item.actualAmount
              )}</div>`;
            });

          // 再显示系数
          tempItems
            .filter((item) => item.displayType === "系数")
            .forEach((item) => {
              html += `<div>系数 (${item.name}): ${item.value}</div>`;
            });
        }

        html += `
                    <div style="margin-top: 10px; font-size: 1.2em; color: #e74c3c;">总计: ${formatCurrency(
                      total
                    )}</div>
                </div>
            `;

        cartSummary.innerHTML = html;
      }

      // 计算总价
      function updateTotal() {
        // 计算基础项目总价（考虑数量）
        let baseTotal = selectedItems.reduce(
          (sum, item) => sum + item.actualPrice * item.quantity,
          0
        );

        // 计算其它费用
        let tempFees = 0;
        tempItems.forEach((item) => {
          if (item.type === "费用") {
            tempFees += item.actualAmount; // 使用实际金额而不是原始金额
          }
        });

        // 计算系数
        let factor = 1;
        tempItems.forEach((item) => {
          if (item.type === "系数") {
            factor *= item.value;
          }
        });

        // 最终总价 = (基础总价 + 其它费用) * 系数
        const total = (baseTotal + tempFees) * factor;

        document.getElementById("totalAmount").textContent =
          formatCurrency(total);

        // 更新详细项目列表
        renderDetailedSummary(baseTotal, tempFees, factor);
      }

      // 渲染详细项目列表
      function renderDetailedSummary(baseTotal, tempFees, factor) {
        const summaryTableBody = document.getElementById("summaryTableBody");
        summaryTableBody.innerHTML = "";

        let itemIndex = 1;

        // 添加选中的项目
        selectedItems.forEach((item) => {
          const row = document.createElement("tr");

          // 计算小计
          const subtotal = item.actualPrice * item.quantity;

          row.innerHTML = `
                    <td style="border: 1px solid #ddd; padding: 10px;">${itemIndex}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">${
                      item.type
                    } - ${item.model} (${item.name})</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <input type="number"
                               value="${item.quantity}"
                               onchange="updateSummaryItemQuantity(${selectedItems.indexOf(
                                 item
                               )}, 'selected', this.value)"
                               min="1"
                               step="1"
                               style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px;">
                    </td>
                    <td style="border: 1px solid #ddd; padding: 10px;">${formatCurrency(
                      item.basePrice
                    )}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <input type="number"
                               value="${item.actualPrice}"
                               onchange="updateSummaryItemPrice(${selectedItems.indexOf(
                                 item
                               )}, 'selected', this.value)"
                               min="0"
                               step="0.01"
                               style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px;">
                    </td>
                    <td style="border: 1px solid #ddd; padding: 10px;">${formatCurrency(
                      subtotal
                    )}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <button class="danger" onclick="removeSummaryItem(${selectedItems.indexOf(
                          item
                        )}, 'selected')">删除</button>
                    </td>
                `;

          summaryTableBody.appendChild(row);
          itemIndex++;
        });

        // 添加其它费用
        tempItems
          .filter((item) => item.displayType === "费用")
          .forEach((item) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                    <td style="border: 1px solid #ddd; padding: 10px;">${itemIndex}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">其它费用 - ${
                      item.name
                    }</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">-</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">${formatCurrency(
                      item.baseAmount
                    )}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <input type="number"
                               value="${item.actualAmount}"
                               onchange="updateSummaryItemPrice(${tempItems.indexOf(
                                 item
                               )}, 'fee', this.value)"
                               min="0"
                               step="0.01"
                               style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px;">
                    </td>
                    <td style="border: 1px solid #ddd; padding: 10px;">${formatCurrency(
                      item.actualAmount
                    )}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <button class="danger" onclick="removeSummaryItem(${tempItems.indexOf(
                          item
                        )}, 'temp')">删除</button>
                    </td>
                `;

            summaryTableBody.appendChild(row);
            itemIndex++;
          });

        // 添加系数
        tempItems
          .filter((item) => item.displayType === "系数")
          .forEach((item) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                    <td style="border: 1px solid #ddd; padding: 10px;">${itemIndex}</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">系数 - ${
                      item.name
                    }</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">-</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">x ${
                      item.value
                    }</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <input type="number"
                               value="${item.value}"
                               onchange="updateSummaryItemPrice(${tempItems.indexOf(
                                 item
                               )}, 'factor', this.value)"
                               min="0"
                               step="0.01"
                               style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 3px;">
                    </td>
                    <td style="border: 1px solid #ddd; padding: 10px;">x ${
                      item.value
                    }</td>
                    <td style="border: 1px solid #ddd; padding: 10px;">
                        <button class="danger" onclick="removeSummaryItem(${tempItems.indexOf(
                          item
                        )}, 'temp')">删除</button>
                    </td>
                `;

            summaryTableBody.appendChild(row);
            itemIndex++;
          });

        // 如果没有项目，显示提示
        if (selectedItems.length === 0 && tempItems.length === 0) {
          const row = document.createElement("tr");
          row.innerHTML = `<td colspan="7" style="border: 1px solid #ddd; padding: 10px; text-align: center;">暂无项目</td>`;
          summaryTableBody.appendChild(row);
        }
      }

      // 显示上传模态框
      function showUploadModal() {
        document.getElementById("uploadModal").style.display = "block";
      }

      // 关闭上传模态框
      function closeUploadModal() {
        document.getElementById("uploadModal").style.display = "none";
      }

      // 上传文件
      async function uploadFile() {
        const fileInput = document.getElementById("uploadFile");
        const file = fileInput.files[0];

        if (!file) {
          showMessage("请选择要上传的文件", "error");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
          // 显示上传进度信息
          showMessage("正在上传文件...", "success");

          // 发送文件到服务器
          const response = await fetch("/api/upload-machines", {
            method: "POST",
            body: formData,
          });

          const result = await response.json();

          if (response.ok) {
            showMessage("文件上传成功", "success");
            closeUploadModal();

            // 重新加载数据以显示新上传的内容
            await loadData();
          } else {
            showMessage(`上传失败: ${result.error || "未知错误"}`, "error");
          }
        } catch (error) {
          console.error("上传文件时出错:", error);
          showMessage(`上传失败: ${error.message}`, "error");
        }
      }

      // 登出功能
      async function logout() {
        try {
          // 从localStorage中获取sessionId
          const sessionId = localStorage.getItem("sessionId");

          if (sessionId) {
            // 调用后端API登出（可选，清理服务器端会话）
            await apiClient
              .request("/users/logout", {
                method: "POST",
                body: JSON.stringify({ sessionId: sessionId }),
              })
              .catch((error) => {
                // 如果登出API调用失败，也不影响本地登出
                console.warn("登出API调用失败:", error);
              });
          }

          // 清除本地存储的会话信息
          localStorage.removeItem("sessionId");
          localStorage.removeItem("username");

          // 重定向到登录页面
          window.location.href = "auth.html";
        } catch (error) {
          console.error("登出过程中发生错误:", error);
          // 即使出错也清除本地会话并重定向
          localStorage.removeItem("sessionId");
          localStorage.removeItem("username");
          window.location.href = "auth.html";
        }
      }

      // 回到主页功能
      function goToHomePage() {
        // 重定向到主页
        window.location.href = "entry.html";
      }

      // 检查用户角色
      async function checkUserRole() {
        const sessionId = localStorage.getItem("sessionId");
        if (!sessionId) {
          return null;
        }

        try {
          // 使用安全的API端点获取当前用户信息（只返回当前用户信息）
          const response = await fetch("/api/current-user-info", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ sessionId: sessionId }),
          });

          if (!response.ok) {
            console.error("获取用户信息失败:", response.status);
            return null;
          }

          const result = await response.json();
          if (result.success && result.user) {
            return result.user.role;
          }
        } catch (error) {
          console.error("获取用户信息时出错:", error);
        }

        return null;
      }

      // 跳转到零件管理页面
      function goToPartsManagement() {
        window.location.href = "parts_management.html";
      }

      // 页面加载时初始化
      window.onload = async function () {
        // 首先进行认证检查
        if (typeof checkAuth === "function") {
          const isAuthenticated = await checkAuth();
          if (!isAuthenticated) {
            return; // 如果认证失败，不继续初始化
          }
        }

        // 自动加载数据（包含最常用项目的加载）
        await loadData();

        // 控制按钮的可见性（统一调用，避免重复API调用）
        if (typeof controlButtonsVisibility === "function") {
          controlButtonsVisibility();
        }

        // 初始化购物车计数
        updateCartCount();

        // 绑定登出按钮事件
        document
          .getElementById("logout-btn")
          ?.addEventListener("click", logout);

        // 初始化浮动按钮显示
        updateFloatingButtons();

        // 初始化最常用项目显示 - 为部件、费用、系数分别显示
        // 直接调用而不是使用setTimeout，确保在数据加载完成后立即显示
        await showTopUsedItems("parts");
      };
    </script>

    <!-- 悬浮清空购物车图标 -->
    <button
      id="clearCartBtn"
      class="floating-cart"
      onclick="clearCartConfirmation()"
      title="清空购物车"
      style="
        background-color: #f44336;
        right: 100px;
        bottom: 30px;
        display: none;
      "
    >
      <span>🗑️</span>
    </button>

    <!-- 悬浮购物车图标 -->
    <button
      class="floating-cart"
      onclick="showCart()"
      title="查看购物车"
      style="bottom: 30px"
    >
      <span>🛒</span>
      <span
        id="floatingCartCount"
        style="
          position: absolute;
          top: -5px;
          right: -5px;
          background-color: red;
          color: white;
          border-radius: 50%;
          width: 20px;
          height: 20px;
          font-size: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
        "
        >0</span
      >
    </button>
  </body>

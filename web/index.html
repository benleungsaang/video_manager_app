<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频管理Web端 1.3</title>
  <!-- 引入Tailwind CSS用于快速构建UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/MaterialIcons-Regular.otf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.ttf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff2">

  <!-- 配置Tailwind自定义颜色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
        },
      }
    }

  </script>

  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }
      .upload-area {
        border: 2px dashed #cbd5e1;
        transition: all 0.3s ease;
      }
      .upload-area:hover {
        border-color: #3b82f6;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary">视频管理系统</h1>

      <!-- 搜索框 -->
      <div class="flex-1 max-w-md mx-8">
        <div class="relative">
          <input
            type="text"
            id="search-input"
            placeholder="搜索视频标题或标签..."
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
      </div>

      <!-- 标签管理按钮 -->
      <button id="tag-management-btn" class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-secondary/90 transition">
        <i class="fa fa-tags mr-1"></i> 标签管理
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <!-- 上传区域 -->
    <div id="upload-area" class="upload-area rounded-xl p-8 mb-8 text-center cursor-pointer">
      <input type="file" id="file-input" accept="video/*" class="hidden">
      <i class="fa fa-cloud-upload text-5xl text-gray-400 mb-4"></i>
      <h2 class="text-xl font-semibold text-gray-700 mb-2">拖放视频到此处上传</h2>
      <p class="text-gray-500 mb-4">或点击选择视频文件</p>
      <button id="upload-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition">
        选择视频
      </button>
    </div>

    <!-- 标签筛选区域 -->
    <div id="tag-filter" class="mb-6 flex flex-wrap gap-2">
      <span class="text-gray-600 font-medium">筛选标签:</span>
      <!-- 标签会通过JavaScript动态生成 -->
    </div>

    <!-- 视频列表区域 -->
    <div id="video-grid" class="video-grid">
      <!-- 视频卡片会通过JavaScript动态生成 -->
      <div class="text-center text-gray-500 py-12">
        <i class="fa fa-film text-4xl mb-4"></i>
        <p>暂无视频，请上传视频文件</p>
      </div>
    </div>
  </main>

  <!-- 标签管理模态框 -->
  <div id="tag-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">标签管理</h3>
        <button id="close-tag-modal" class="text-gray-500 hover:text-gray-700">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>

      <!-- 添加新标签 -->
      <div class="flex mb-6">
        <input
          type="text"
          id="new-tag-input"
          placeholder="输入新标签名称"
          class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-1 focus:ring-primary"
        >
        <button id="add-tag-btn" class="bg-primary text-white px-4 py-2 rounded-r-lg hover:bg-primary/90">
          添加
        </button>
      </div>

      <!-- 标签列表 -->
      <div id="tag-list" class="max-h-60 overflow-y-auto mb-4">
        <!-- 标签项会通过JavaScript动态生成 -->
      </div>
    </div>
  </div>

  <script>

    // 与Flutter原生通信的通道
    const flutterChannel = {
      // 存储WebSocket实例
      _ws: null,
      // 存储请求的回调函数，用requestId映射
      _callbacks: new Map(),

      // 初始化WebSocket连接
      _initWebSocket() {
        if (this._ws && this._ws.readyState === WebSocket.OPEN) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
          this._ws = new WebSocket(wsUrl);

          this._ws.onopen = () => {
            console.log('WebSocket连接已建立');
            // 监听服务端消息
            this._ws.onmessage = (event) => this._handleMessage(event);
            resolve();
          };

          this._ws.onerror = (error) => {
            console.error('WebSocket连接错误:', error);
            reject(error);
          };

          this._ws.onclose = () => {
            console.log('WebSocket连接已关闭，尝试重连...');
            this._ws = null;
            // 3秒后尝试重连
            setTimeout(() => this._initWebSocket(), 3000);
          };
        });
      },


      // 处理从服务端收到的消息
      _handleMessage(event) {
        try {
          const response = JSON.parse(event.data);
          console.log('收到服务端响应:', response);

          // 查找对应的回调函数
          const callback = this._callbacks.get(response.id);
          if (callback) {
            callback(response);
            this._callbacks.delete(response.id);
          }
        } catch (error) {
          console.error('处理消息错误:', error);
        }
      },

      // 生成唯一请求ID（修改这部分）
      _generateRequestId() {
        // 使用时间戳+随机数确保唯一性
        return Date.now().toString() + Math.floor(Math.random() * 1000).toString();
      },
      
      // 发送请求到服务端
      _sendRequest(action, params = {}) {
        return new Promise(async (resolve, reject) => {
          try {
            // 确保连接已建立
            await this._initWebSocket();

            // 生成唯一请求ID
            const requestId = this._generateRequestId();
            
            // 存储回调函数
            this._callbacks.set(requestId, (response) => {
              if (response.success) {
                resolve(response.data);
              } else {
                reject(new Error(response.error || '请求失败'));
              }
            });

            // 发送请求
            const request = {
              id: requestId,
              action: action,
              params: params
            };
            console.log('发送请求:', request);
            this._ws.send(JSON.stringify(request));
          } catch (error) {
            reject(error);
          }
        });
      },

      // 标签相关接口
      getTags: () => flutterChannel._sendRequest('getTags'),
      addTag: (tagName) => flutterChannel._sendRequest('createTag', { name: tagName }),
      deleteTag: (tagId) => flutterChannel._sendRequest('deleteTag', { id: tagId }),

      // 视频相关接口
      getVideos: () => flutterChannel._sendRequest('getVideos'),     
      getThumbnail: (videoId) => flutterChannel._sendRequest('getThumbnail', { videoId: videoId }), 
      uploadVideo: (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => {
            const base64Data = reader.result.split(',')[1];
            flutterChannel._sendRequest('uploadVideo', {
              name: file.name,
              base64Data: base64Data
            }).then(resolve).catch(reject);
          };
        });
        render.error = reject;
      }
    };

    // 状态管理
    const state = {
      videos: [],
      tags: [],
      selectedTagIds: []
    };

    // DOM元素引用
    const elements = {
      uploadArea: document.getElementById('upload-area'),
      fileInput: document.getElementById('file-input'),
      uploadBtn: document.getElementById('upload-btn'),
      videoGrid: document.getElementById('video-grid'),
      searchInput: document.getElementById('search-input'),
      tagFilter: document.getElementById('tag-filter'),
      tagManagementBtn: document.getElementById('tag-management-btn'),
      tagModal: document.getElementById('tag-modal'),
      closeTagModal: document.getElementById('close-tag-modal'),
      newTagInput: document.getElementById('new-tag-input'),
      addTagBtn: document.getElementById('add-tag-btn'),
      tagList: document.getElementById('tag-list')
    };


    // 初始化函数
    async function init() {
      console.log('初始化函数 init() 被调用');
      try {        
        // 加载视频和标签数据
        await loadTags();
        await loadVideos();

        // 绑定事件监听器
        bindEvents();
      } catch (error) {
        console.log('初始化失败:', error);
      }
    }

    // 加载视频列表
    async function loadVideos() {
      try {
        console.log('加载视频列表...');
        const videos = await flutterChannel.getVideos();
        state.videos = videos;
        renderVideoGrid();
      } catch (error) {
        console.error('加载视频失败:', error);
      }
    }

    // 加载标签列表
    async function loadTags() {
      try {
        console.log('加载标签列表...');
        const tags = await flutterChannel.getTags();
        state.tags = tags;
        renderTagFilters();
        renderTagList();
      } catch (error) {
        console.error('加载标签失败:', error);
      }
    }
    // 优化：避免重复请求，对相同路径的缩略图进行缓存，减少重复请求
    const thumbnailCache = new Map();

    // 渲染视频缩略图
    async function renderVideoThumbnail(video) {
      if (!video.id) {
        return '<i class="fa fa-film text-4xl text-gray-400"></i>';
      }
      
      // 检查缓存
      if (thumbnailCache.has(video.id)) {
        return thumbnailCache.get(video.id);
      }
      
      try {
        // 获取Base64格式的缩略图
        const thumbnailData = await flutterChannel.getThumbnail(video.id);
        // 明确检查base64字段是否存在
        if (!thumbnailData) {
          throw new Error('缩略图数据格式错误，缺少base64字段');
        }

        const imgHtml =  `<img src="data:image/jpeg;base64,${thumbnailData.base64}" 
                    alt="${video.title}" 
                    class="w-full h-full object-cover">`;
        thumbnailCache.set(video.id, imgHtml);
        return imgHtml;
      } catch (error) {
        console.error(`加载缩略图失败（视频ID: ${video.id}）:`, error);
        return '<i class="fa fa-film text-4xl text-gray-400"></i>';
      }
    }

    // 渲染视频网格
    async function renderVideoGrid() {
      // 应用标签筛选
      let filteredVideos = state.videos;
      if (state.selectedTagIds.length > 0) {
        filteredVideos = state.videos.filter(video =>
          state.selectedTagIds.every(tagId => video.tagIds.includes(tagId))
        );
      }

      // 应用搜索筛选
      const searchTerm = elements.searchInput.value.toLowerCase();
      if (searchTerm) {
        filteredVideos = filteredVideos.filter(video =>
          video.title.toLowerCase().includes(searchTerm) ||
          video.tagIds.some(tag => tag.name.toLowerCase().includes(searchTerm))
        );
      }

      if (filteredVideos.length === 0) {
        elements.videoGrid.innerHTML = `
          <div class="text-center text-gray-500 py-12">
            <i class="fa fa-search text-4xl mb-4"></i>
            <p>未找到匹配的视频</p>
          </div>
        `;
        return;
      }

      
  const videoCards = await Promise.all(filteredVideos.map(async (video) => {
    const thumbnailHtml = await renderVideoThumbnail(video);
    return `
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-lg transition">
          <div class="relative aspect-video bg-gray-100">        
            <div class="absolute bottom-2 right-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${formatFileSize(video.fileSize)}
            </div>
              ${thumbnailHtml}            
            <div class="absolute bottom-2 left-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${formatDuration(video.duration)}
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-gray-800 mb-2 truncate">${video.title}</h3>
            <div class="flex flex-wrap gap-1 mb-3">
              ${video.tagIds.map(tagId => {
                const tag = state.tags.find(t => t.id === tagId);              
                return tag ? `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">${tag.name}</span>` 
                : 
                `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">当前未有标签</span>`;
            }).join('')}
            </div>
            <div class="text-xs text-gray-500">
              ${formatDate(video.uploadTime)}
            </div>
          </div>
        </div>
      `}));
      elements.videoGrid.innerHTML = videoCards.join('');
    }

    // 渲染标签筛选器
    function renderTagFilters() {
      if (state.tags.length === 0) {
        elements.tagFilter.innerHTML = '<span class="text-gray-600 font-medium">暂无标签</span>';
        return;
      }

      elements.tagFilter.innerHTML = `
        <span class="text-gray-600 font-medium">筛选标签:</span>
        ${state.selectedTagIds.length > 0 ? `
          <button id="clear-tags" class="text-gray-500 hover:text-gray-700">
            <i class="fa fa-times-circle"></i> 清除筛选
          </button>
        ` : ''}
        ${state.tags.map(tag => `
          <button
            class="tag-filter-btn px-3 py-1 rounded-full text-sm ${
              state.selectedTagIds.includes(tag.id)
                ? 'bg-primary text-white'
                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
            }"
            data-tag-id="${tag.id}"
          >
            ${tag.name}
          </button>
        `).join('')}
      `;

      // 绑定标签筛选事件
      document.querySelectorAll('.tag-filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tagId = e.currentTarget.dataset.tagId;
          toggleTagFilter(tagId);
        });
      });

      // 绑定清除筛选事件
      const clearBtn = document.getElementById('clear-tags');
      if (clearBtn) {
        clearBtn.addEventListener('click', clearTagFilters);
      }
    }

    // 渲染标签列表（管理模态框中）
    function renderTagList() {
      if (state.tags.length === 0) {
        elements.tagList.innerHTML = '<p class="text-gray-500 text-center py-4">暂无标签</p>';
        return;
      }

      elements.tagList.innerHTML = state.tags.map(tag => `
        <div class="flex justify-between items-center p-2 border-b last:border-0">
          <span>${tag.name}</span>
          <div class="flex items-center">
            <span class="text-xs text-gray-500 mr-3">${tag.videoCount}个视频</span>
            <button class="delete-tag-btn text-red-500 hover:text-red-700" data-tag-id="${tag.id}">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');

      // 绑定删除标签事件
      document.querySelectorAll('.delete-tag-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const tagId = e.currentTarget.dataset.tagId;
          await flutterChannel.deleteTag(tagId);
          await loadTags(); // 重新加载标签
          await loadVideos(); // 重新加载视频
        });
      });
    }

    // 切换标签筛选状态
    function toggleTagFilter(tagId) {
      setState(prev => {
        if (prev.selectedTagIds.includes(tagId)) {
          return {
            selectedTagIds: prev.selectedTagIds.filter(id => id !== tagId)
          };
        } else {
          return {
            selectedTagIds: [...prev.selectedTagIds, tagId]
          };
        }
      });
    }

    // 清除所有标签筛选
    function clearTagFilters() {
      setState({ selectedTagIds: [] });
    }

    // 更新状态并重新渲染
    function setState(updater) {
      if (typeof updater === 'function') {
        state = { ...state, ...updater(state) };
      } else {
        state = { ...state, ...updater };
      }
      renderVideoGrid();
      renderTagFilters();
    }

    // 绑定所有事件处理程序
    function bindEvents() {
      // 上传区域点击事件
      elements.uploadArea.addEventListener('click', () => {
        elements.fileInput.click();
      });

      // 上传按钮点击事件
      elements.uploadBtn.addEventListener('click', () => {
        elements.fileInput.click();
      });

      // 文件选择事件
      elements.fileInput.addEventListener('change', async (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          // 显示上传中状态
          elements.uploadArea.innerHTML = `
            <i class="fa fa-spinner fa-spin text-5xl text-gray-400 mb-4"></i>
            <p class="text-gray-500">正在上传: ${file.name}</p>
          `;

          try {
            // 调用Flutter上传视频
            await flutterChannel.uploadVideo(file);
            // 上传完成后重新加载视频列表
            await loadVideos();
            // 重置上传区域
            elements.uploadArea.innerHTML = `
              <i class="fa fa-cloud-upload text-5xl text-gray-400 mb-4"></i>
              <h2 class="text-xl font-semibold text-gray-700 mb-2">拖放视频到此处上传</h2>
              <p class="text-gray-500 mb-4">或点击选择视频文件</p>
              <button id="upload-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition">
                选择视频
              </button>
            `;
            // 重新绑定上传按钮事件
            elements.uploadBtn = document.getElementById('upload-btn');
            elements.uploadBtn.addEventListener('click', () => {
              elements.fileInput.click();
            });
          } catch (error) {
            console.error('上传失败:', error);
            elements.uploadArea.innerHTML = `
              <i class="fa fa-exclamation-triangle text-5xl text-red-400 mb-4"></i>
              <h2 class="text-xl font-semibold text-red-700 mb-2">上传失败</h2>
              <p class="text-gray-500 mb-4">请重试或选择其他文件</p>
              <button id="upload-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition">
                重新上传
              </button>
            `;
            elements.uploadBtn = document.getElementById('upload-btn');
            elements.uploadBtn.addEventListener('click', () => {
              elements.fileInput.click();
            });
          }
        }
      });

      // 拖放上传事件
      elements.uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        elements.uploadArea.classList.add('border-primary');
      });

      elements.uploadArea.addEventListener('dragleave', () => {
        elements.uploadArea.classList.remove('border-primary');
      });

      elements.uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        elements.uploadArea.classList.remove('border-primary');

        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const file = e.dataTransfer.files[0];
          if (file.type.startsWith('video/')) {
            // 处理视频文件
            elements.fileInput.files = e.dataTransfer.files;
            const event = new Event('change');
            elements.fileInput.dispatchEvent(event);
          } else {
            alert('请上传视频文件');
          }
        }
      });

      // 搜索输入事件
      elements.searchInput.addEventListener('input', renderVideoGrid);

      // 标签管理按钮事件
      elements.tagManagementBtn.addEventListener('click', () => {
        elements.tagModal.classList.remove('hidden');
      });

      // 关闭标签模态框事件
      elements.closeTagModal.addEventListener('click', () => {
        elements.tagModal.classList.add('hidden');
      });

      // 添加标签按钮事件
      elements.addTagBtn.addEventListener('click', async () => {
        const tagName = elements.newTagInput.value.trim();
        if (tagName) {
          await flutterChannel.addTag(tagName);
          elements.newTagInput.value = '';
          await loadTags(); // 重新加载标签
        }
      });

      // 按Enter键添加标签
      elements.newTagInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          elements.addTagBtn.click();
        }
      });
    }

    // 工具函数：格式化时长
    function formatDuration(seconds) {
      if (!seconds) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 工具函数：格式化文件大小
    function formatFileSize(bytes) {
      if (bytes <= 0) return "0 B";
      const suffixes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(2)} ${suffixes[i]}`;
    }

    // 工具函数：格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString();
    }

    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频管理Web端 1.3</title>
  <!-- 引入Tailwind CSS用于快速构建UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/MaterialIcons-Regular.otf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.ttf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff2">

  <!-- 配置Tailwind自定义颜色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
        },
      }
    }

  </script>

  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }
      .upload-area {
        border: 2px dashed #cbd5e1;
        transition: all 0.3s ease;
      }
      .upload-area:hover {
        border-color: #3b82f6;
      }
      .modal-backdrop {
        backdrop-filter: blur(4px);
      }
      .tag-pill {
        @apply px-2 py-1 rounded-full text-xs cursor-pointer;
      }
      .tag-pill-selected {
        @apply bg-primary text-white;
      }
      .tag-pill-unselected {
        @apply bg-gray-200 text-gray-700 hover:bg-gray-300;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary">视频管理系统</h1>

      <!-- 搜索框 -->
      <div class="flex-1 max-w-md mx-8">
        <div class="relative">
          <input
            type="text"
            id="search-input"
            placeholder="搜索 【 整个数据库 】 视频 - 标题或标签..."
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
      </div>

      <!-- 上传视频按钮 -->
      <button id="upload-btn" class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-secondary/90 transition">
        <i class="fa fa-cloud-upload mr-1"></i> 上传视频
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">

     <!-- 本地视频筛选 -->
      <div class="mb-6">
        <!-- <div class="flex items-center mb-2">
          <i class="fa fa-filter text-gray-500 mr-2"></i>
          <span class="text-gray-600 font-medium">当前视频筛选：</span>
        </div> -->
        <div class="relative">
          <input
            type="text"
            id="filter-input"
            placeholder="在 【 当前搜索结果 】 中筛选 - 标题或标签..."
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50"
          >
          <i class="fa fa-filter absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
      </div>

    <!-- 视频列表区域 -->
    <div id="video-grid" class="video-grid">
      <!-- 视频卡片会通过JavaScript动态生成 -->
      <div class="text-center text-gray-500 py-12">
        <i class="fa fa-film text-4xl mb-4"></i>
        <p>暂无视频，请上传视频文件</p>
      </div>
    </div>
  </main>

 <!---------------------- 视频上传浮框 --------------------------->
  <div id="upload-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
      <!-- 浮框头部 -->
      <div class="flex justify-between items-center p-4 border-b">
        <h3 class="text-xl font-bold">上传视频</h3>
        <button id="close-upload-modal" class="text-gray-500 hover:text-gray-700 p-2">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>

      <!-- 浮框内容 -->
      <div class="flex-1 overflow-y-auto p-6">
        <!-- 视频预览区域 -->
        <div class="mb-6">
          <div class="bg-gray-100 rounded-lg overflow-hidden">
            <video id="video-preview" class="w-full aspect-video object-contain" controls crossorigin="anonymous"></video>
          </div>
          <div class="mt-2 text-sm text-gray-500 flex justify-between">
            <span id="video-duration">时长: --:--</span>
            <span id="video-size">大小: --</span>
          </div>
          <!-- 视频边编辑边上传，先上传的按钮 -->
          <button id="upload-first-btn" class="hidden bg-secondary text-white px-6 py-2 rounded-lg hover:bg-secondary/90 transition">
            先上传视频
          </button>
        </div>

        <!-- 视频信息表单 -->
        <div class="space-y-4">
          <!-- 标题输入 -->
          <div>
            <label for="video-title" class="block text-sm font-medium text-gray-700 mb-1">标题 <span class="text-red-500">*</span></label>
            <input
              type="text"
              id="video-title"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50"
              placeholder="请输入视频标题"
            >
          </div>

          <!-- 标签选择 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">标签</label>
            <div id="tag-selection" class="flex flex-wrap gap-2 mb-2 max-h-32 overflow-y-auto p-2 border rounded-lg">
              <!-- 标签会动态生成 -->
              <p class="text-gray-500 text-sm w-full text-center">待添加标签...</p>
            </div>
            <div class="flex items-center">
              <input
                type="text"
                id="new-tag-input-modal"
                placeholder="添加新标签"
                class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-1 focus:ring-primary"
              >
              <button id="add-tag-btn-modal" class="bg-primary text-white px-4 py-2 rounded-r-lg hover:bg-primary/90">
                添加
              </button>
            </div>
          </div>

          <!-- 备注信息 -->
          <div>
            <label for="video-remark" class="block text-sm font-medium text-gray-700 mb-1">备注</label>
            <textarea
              id="video-remark"
              rows="3"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50"
              placeholder="请输入备注信息（可选）"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- 浮框底部 -->
      <div class="p-4 border-t flex justify-end gap-3">
        <button id="cancel-upload-btn" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
          取消
        </button>
        <button id="save-video-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition">
          保存视频
        </button>
      </div>
      <!-- 浮框底部 - 进度条 -->
      <div class="px-6 pb-2 hidden" id="upload-progress-container">
        <div class="text-sm text-gray-600 mb-1">上传进度</div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
          <div id="upload-progress-bar" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>


  <!-- 确认取消对话框 -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-xl w-full max-w-md p-6">
      <h3 class="text-xl font-bold mb-4">确认取消</h3>
      <p class="text-gray-600 mb-6">确定要取消上传吗？已上传的部分将被丢弃。</p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel-btn" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
          继续编辑
        </button>
        <button id="confirm-ok-btn" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">
          确认取消
        </button>
      </div>
    </div>
  </div>
 <!---------------------- 视频上传浮框 --------------------------->

  <!-- 操作成功提示框 toast -->
  <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
    操作成功
  </div>

  <script>

    // 与Flutter原生通信的通道
    const flutterChannel = {
      // 存储WebSocket实例
      _ws: null,
      // 存储请求的回调函数，用requestId映射
      _callbacks: new Map(),

      // 初始化WebSocket连接
      _initWebSocket() {
        if (this._ws && this._ws.readyState === WebSocket.OPEN) {
          return Promise.resolve();
        }

        return new Promise((resolve, reject) => {
          const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
          this._ws = new WebSocket(wsUrl);

          this._ws.onopen = () => {
            console.log('WebSocket连接已建立');
            // 监听服务端消息
            this._ws.onmessage = (event) => this._handleMessage(event);
            resolve();
          };

          this._ws.onerror = (error) => {
            console.error('WebSocket连接错误:', error);
            reject(error);
          };

          this._ws.onclose = () => {
            console.log('WebSocket连接已关闭，尝试重连...');
            this._ws = null;
            // 3秒后尝试重连
            setTimeout(() => this._initWebSocket(), 3000);
          };
        });
      },


      // 处理从服务端收到的消息
      _handleMessage(event) {
        try {
          const response = JSON.parse(event.data);
          console.log('收到服务端响应:', response);

          // 查找对应的回调函数
          const callback = this._callbacks.get(response.id);
          if (callback) {
            callback(response);
            this._callbacks.delete(response.id);
          }
        } catch (error) {
          console.error('处理消息错误:', error);
        }
      },

      // 生成唯一请求ID（修改这部分）
      _generateRequestId() {
        // 使用时间戳+随机数确保唯一性
        return Date.now().toString() + Math.floor(Math.random() * 1000).toString();
      },

      // 发送请求到服务端
      _sendRequest(action, params = {}) {
        return new Promise(async (resolve, reject) => {
          try {
            // 确保连接已建立
            await this._initWebSocket();

            // 生成唯一请求ID
            const requestId = this._generateRequestId();

            // 存储回调函数
            this._callbacks.set(requestId, (response) => {
              if (response.success) {
                resolve(response.data);
              } else {
                reject(new Error(response.error || '请求失败'));
              }
            });

            // 发送请求
            const request = {
              id: requestId,
              action: action,
              params: params
            };
            console.log('发送请求:', request);
            this._ws.send(JSON.stringify(request));
          } catch (error) {
            reject(error);
          }
        });
      },

      // 标签相关接口
      // 载入标签列表
      getTags: () => flutterChannel._sendRequest('getTags'),
      // 新增标签
      addTag: (tagName) => flutterChannel._sendRequest('createTag', { name: tagName }),
      // 删除标签
      deleteTag: (tagId) => flutterChannel._sendRequest('deleteTag', { id: tagId }),

      // 视频相关接口
      // 载入视频列表
      getVideos: () => flutterChannel._sendRequest('getVideos'),
      // 获取视频播放链接
      getVideoUrl:(videoId)=> flutterChannel._sendRequest('getVideoUrl', { videoId: videoId }),
      // 删除视频
      deleteVideo: (videoId) => flutterChannel._sendRequest('deleteVideo', { id: videoId }),
      // 获取视频缩略图
      getThumbnail: (videoId) => flutterChannel._sendRequest('getThumbnail', { videoId: videoId }),
      //  搜索视频
      searchVideos: (searchTerm) => flutterChannel._sendRequest('searchVideos', { query: searchTerm }),

      // 分块上传二进制数据
      sendBinaryChunk :(params) =>{
        return new Promise((resolve, reject) => {
          const requestId = flutterChannel._generateRequestId();
          let binarySent = false;

          // 发送块元数据
          const metaRequest = {
            id: requestId,
            action: 'uploadBinaryChunk',
            params: {
              fileId: params.fileId,
              chunkIndex: params.chunkIndex,
              totalChunks: params.totalChunks
            }
          };

          // 监听元数据响应
          const metaListener = (event) => {
            const response = JSON.parse(event.data);
            if (response.id === requestId && response.status === 'ready') {
              flutterChannel._ws.removeEventListener('message', metaListener);

              // 发送二进制数据
              params.blob.arrayBuffer().then(buffer => {
                flutterChannel._ws.send(buffer);
                binarySent = true;

                // 监听块确认
                const chunkListener = (event) => {
                  const chunkResponse = JSON.parse(event.data);
                  if (chunkResponse.id === requestId) {
                    flutterChannel._ws.removeEventListener('message', chunkListener);
                    if (chunkResponse.success) {
                      resolve(chunkResponse);
                    } else {
                      reject(new Error(chunkResponse.error));
                    }
                  }
                };
                flutterChannel._ws.addEventListener('message', chunkListener);
              });
            }
          };

          flutterChannel._ws.addEventListener('message', metaListener);
          flutterChannel._ws.send(JSON.stringify(metaRequest));

          // 超时处理
          setTimeout(() => {
            if (!binarySent) {
              flutterChannel._ws.removeEventListener('message', metaListener);
              reject(new Error('发送超时'));
            }
          }, 10000);
        });
      },
      completeBinaryUpload :(fileId, fileName, duration, tagIds, remark) =>{
        return flutterChannel._sendRequest('completeBinaryUpload', {
          fileId,
          name: fileName,
          duration,
          tagIds,
          remark,
          fileSize: state.currentUploadFile.size
        });
      },
    };

    // 状态管理
    const state = {
      videos: [],
      originalVideos: null, // 用于存储原始视频列表，搜索时使用
      tags: [],
      selectedTagIds: [],
      currentUploadFile: null, // 当前正在上传的文件
      currentEditingVideo: null, // 当前正在编辑的视频
      selectedTagIdsForUpload: [], // 上传视频时选择的标签ID
      pendingUploads: new Map(), // 存储已上传但未合并的文件ID
      currentFileId: null, // 当前上传的文件ID
    };

    // DOM元素引用
    const elements = {
      searchInput: document.getElementById('search-input'), // 数据库搜索输入框
      filterInput: document.getElementById('filter-input'), // 本地视频筛选输入框
      uploadBtn: document.getElementById('upload-btn'), // 上传按钮
      videoGrid: document.getElementById('video-grid'), // 视频网格容器

      // 上传浮框相关元素
      uploadModal: document.getElementById('upload-modal'),
      uploadFirstBtn: document.getElementById('upload-first-btn'),
      closeUploadModal: document.getElementById('close-upload-modal'),
      videoPreview: document.getElementById('video-preview'),
      videoTitle: document.getElementById('video-title'),
      videoDuration: document.getElementById('video-duration'),
      videoSize: document.getElementById('video-size'),
      videoRemark: document.getElementById('video-remark'),
      tagSelection: document.getElementById('tag-selection'),
      newTagInputModal: document.getElementById('new-tag-input-modal'),
      addTagBtnModal: document.getElementById('add-tag-btn-modal'),
      saveVideoBtn: document.getElementById('save-video-btn'),
      cancelUploadBtn: document.getElementById('cancel-upload-btn'),
      // 确认对话框
      confirmModal: document.getElementById('confirm-modal'),
      confirmCancelBtn: document.getElementById('confirm-cancel-btn'),
      confirmOkBtn: document.getElementById('confirm-ok-btn'),
      // 隐藏的文件输入
      fileInput: document.createElement('input')
    };

    // 初始化文件输入元素(上传视频模块 相关设置)
    elements.fileInput.type = 'file';
    elements.fileInput.accept = 'video/*';
    elements.fileInput.classList.add('hidden');
    document.body.appendChild(elements.fileInput);


    // 初始化函数
    async function init() {
      console.log('初始化函数 init() 被调用');
      try {
        // 加载视频和标签数据
        await loadTags();
        await loadVideos();

        // 绑定事件监听器
        bindEvents();
      } catch (error) {
        console.log('初始化失败:', error);
      }
    }

    // 加载视频列表
    async function loadVideos() {
      try {
        console.log('加载视频列表...');
        const videos = await flutterChannel.getVideos();
        state.videos = videos;
        renderVideoGrid();
      } catch (error) {
        console.error('加载视频失败:', error);
      }
    }

    // 加载标签列表
    async function loadTags() {
      try {
        console.log('加载标签列表...');
        const tags = await flutterChannel.getTags();
        state.tags = tags;
        // renderTagFilters();
        // renderTagList();
      } catch (error) {
        console.error('加载标签失败:', error);
      }
    }

    // 优化：避免重复请求，对相同路径的缩略图进行缓存，减少重复请求
    const thumbnailCache = new Map();
    // 渲染视频缩略图
    async function renderVideoThumbnail(video) {
      if (!video.id) {
        return '<i class="fa fa-film text-4xl text-gray-400"></i>';
      }

      // 检查缓存
      if (thumbnailCache.has(video.id)) {
        return thumbnailCache.get(video.id);
      }

      try {
        // 获取Base64格式的缩略图
        const thumbnailData = await flutterChannel.getThumbnail(video.id);
        // 明确检查base64字段是否存在
        if (!thumbnailData) {
          throw new Error('缩略图数据格式错误，缺少base64字段');
        }

        const imgHtml =  `<img src="data:image/jpeg;base64,${thumbnailData.base64}"
                    alt="${video.title}"
                    class="w-full h-full object-cover">`;
        thumbnailCache.set(video.id, imgHtml);
        return imgHtml;
      } catch (error) {
        console.error(`加载缩略图失败（视频ID: ${video.id}）:`, error);
        return '<i class="fa fa-film text-4xl text-gray-400"></i>';
      }
    }

    // 渲染视频网格
    async function renderVideoGrid() {
      // 1. 应用标签筛选
      let filteredVideos = state.videos;
      if (state.selectedTagIds.length > 0) {
        filteredVideos = state.videos.filter(video =>
          state.selectedTagIds.every(tagId => video.tagIds.includes(tagId))
        );
      }

      // 2. 应用本地筛选（使用localeCompare避免中文问题）
      const filterTerm = elements.filterInput.value.trim();
      if (filterTerm) {
        const filterLower = filterTerm.toLowerCase();
        filteredVideos = filteredVideos.filter(video =>
          video.title.toLowerCase().includes(filterLower) ||
          video.tagIds.some(tagId => {
            const tag = state.tags.find(t => t.id === tagId);
            return tag && tag.name.toLowerCase().includes(filterLower);
          })
        );
      }

      // 3. 无匹配结果时的显示
      if (filteredVideos.length === 0) {
        elements.videoGrid.innerHTML = `
          <div class="text-center text-gray-500 py-12">
            <i class="fa fa-search text-4xl mb-4"></i>
            <p>未找到匹配的视频</p>
          </div>
        `;
        return;
      }


  const videoCards = await Promise.all(filteredVideos.map(async (video) => {
    const thumbnailHtml = await renderVideoThumbnail(video);
    return `
      <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-lg transition cursor-pointer" data-video-id="${video.id}">
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-lg transition">
          <div class="relative aspect-video bg-gray-100">
            <div class="absolute bottom-2 right-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${formatFileSize(video.fileSize)}
            </div>
              ${thumbnailHtml}
            <!-- ↓ ↓ ↓ 视频卡片右上角 - 功能菜单 ↓ ↓ ↓ -->
            <div class="absolute top-2 right-2">
              <button class="delete-menu-btn bg-black/50 text-white p-1 rounded-full" data-video-id="${video.id}">
                <i class="fa fa-ellipsis-v"></i>
              </button>
              <!-- 删除菜单 -->
              <div class="delete-menu hidden absolute right-0 mt-1 bg-white rounded-lg shadow-lg p-2 z-10">
                <button class="delete-video-btn text-red-500 hover:bg-gray-100 px-2 py-1 text-sm" data-video-id="${video.id}">
                  <i class="fa fa-trash mr-1"></i>删除
                </button>
              </div>
            </div>
            <!-- ↑ ↑ ↑ 视频卡片右上角 - 功能菜单 ↑ ↑ ↑ -->
            <div class="absolute bottom-2 left-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${formatDuration(video.duration)}
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-gray-800 mb-2 truncate">${video.title}</h3>
            <div class="flex flex-wrap gap-1 mb-3">
              ${video.tagIds.map(tagId => {
                const tag = state.tags.find(t => t.id === tagId);
                return tag ? `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">${tag.name}</span>`
                :
                `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">当前未有标签</span>`;
            }).join('')}
            </div>
            <div class="text-xs text-gray-500">
              ${formatDate(video.uploadTime)}
            </div>
          </div>
        </div>
      </div>
      `}));
      elements.videoGrid.innerHTML = videoCards.join('');
    }

    // 渲染标签选择区域
    function renderTagSelection() {
      if (state.tags.length === 0) {
        elements.tagSelection.innerHTML = '<p class="text-gray-500 text-sm w-full text-center">暂无标签，请添加标签</p>';
        return;
      }

      elements.tagSelection.innerHTML = state.tags.map(tag => `
        <span
          class="tag-pill ${state.selectedTagIdsForUpload.includes(tag.id) ? 'tag-pill-selected' : 'tag-pill-unselected'}"
          data-tag-id="${tag.id}"
        >
          ${tag.name}
        </span>
      `).join('');

      // 绑定标签选择事件
      document.querySelectorAll('#tag-selection .tag-pill').forEach(pill => {
        pill.addEventListener('click', (e) => {
          const tagId = e.currentTarget.dataset.tagId;
          toggleTagSelection(tagId);
        });
      });
    }

    // 切换标签选择状态
    function toggleTagSelection(tagId) {
      if (state.selectedTagIdsForUpload.includes(tagId)) {
        state.selectedTagIdsForUpload = state.selectedTagIdsForUpload.filter(id => id !== tagId);
      } else {
        state.selectedTagIdsForUpload.push(tagId);
      }
      renderTagSelection();
    }

    // 处理视频文件选择
    function handleFileSelection(file) {
      if (!file || !file.type.startsWith('video/')) {
        alert('请选择有效的视频文件');
        return;
      }

      // 保存当前上传的文件
      state.currentUploadFile = file;

      // 重置表单
      elements.videoTitle.value = file.name.replace(/\.[^/.]+$/, ""); // 去除扩展名作为默认标题
      elements.videoRemark.value = '';
      state.selectedTagIdsForUpload = [];

      // 显示视频预览
      const videoURL = URL.createObjectURL(file);
      elements.videoPreview.src = videoURL;
      elements.videoPreview.crossOrigin = 'anonymous';
      elements.videoPreview.preload = 'metadata';

      // 获取视频信息
      elements.videoSize.textContent = `大小: ${formatFileSize(file.size)}`;

      // 加载视频元数据以获取时长
      elements.videoPreview.onloadedmetadata = () => {
        const duration = Math.floor(elements.videoPreview.duration);
        elements.videoDuration.textContent = `时长: ${formatDuration(duration)}`;
      };

      // 显示上传浮框
      elements.uploadModal.classList.remove('hidden');
      elements.uploadFirstBtn.classList.remove('hidden');

      // 加载标签
      loadTags();
      renderTagSelection();
    }

    // 保存视频信息并上传
    async function saveVideo() {
      const title = elements.videoTitle.value.trim();
      if (!title) {
        alert('请输入视频标题');
        return;
      }

      if (!state.currentUploadFile) {
        alert('未找到视频文件，请重新选择');
        return;
      }

      try {
        let fileId = state.currentFileId;
            // 如果还没上传，先上传
        if (!fileId || !state.pendingUploads.has(fileId)) {

          // 准备上传数据
          const videoFile = state.currentUploadFile;
          const duration = Math.floor(elements.videoPreview.duration);
          fileId = 'video_' + Date.now(); // 唯一标识
          state.currentFileId = fileId;

          // 显示进度条容器
          document.getElementById('upload-progress-container').classList.remove('hidden');
          const progressBar = document.getElementById('upload-progress-bar');
          progressBar.style.width = '0%';

          // 禁用按钮并显示上传中状态
          elements.saveVideoBtn.disabled = true;
          elements.saveVideoBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 上传中...';
          elements.cancelUploadBtn.disabled = true;

          // 初始化上传
          await flutterChannel._sendRequest('initBinaryUpload', {
            fileId,
            fileName: videoFile.name,
            totalSize: videoFile.size,
            mimeType: videoFile.type
          });

          // 分块上传
          await uploadChunks(videoFile, fileId, (progress) => {
            progressBar.style.width = `${progress}%`;
          });
        }

        // 完成上传（合并文件）
        const result = await flutterChannel.completeBinaryUpload(
          fileId,
          title,
          duration,
          state.selectedTagIdsForUpload,
          elements.videoRemark.value.trim()
        );

        // 从待处理列表移除
        state.pendingUploads.delete(fileId);

        console.log('视频上传完成:', result);

        // 刷新列表并重置状态
        await loadVideos();
        state.selectedTagIdsForUpload = [];
        elements.uploadModal.classList.add('hidden');
        showToast('视频上传成功');
        elements.videoPreview.src = '';
        URL.revokeObjectURL(elements.videoPreview.src);
      } catch (errer){
        console.error('上传失败:', error);
        alert(`上传失败: ${error.message || '未知错误'}`);
      } finally {
        elements.saveVideoBtn.disabled = false;
        elements.saveVideoBtn.textContent = '保存视频';
        elements.cancelUploadBtn.disabled = false;
        state.currentUploadFile = null;
        document.getElementById('upload-progress-container').classList.add('hidden');
      }

    }

    // 分块上传二进制视频文件
    async function uploadBinaryInChunks(fileId, videoFile, onProgress) {
      const chunkSize = 256 * 1024; // 256KB/块
      const totalSize = videoFile.size;
      const totalChunks = Math.ceil(totalSize / chunkSize);

      for (let start = 0; start < totalSize; start += chunkSize) {
        const end = Math.min(start + chunkSize, totalSize);
        const chunkBlob = videoFile.slice(start, end);
        const chunkIndex = Math.floor(start / chunkSize);

        try {
          // 发送二进制块
          await flutterChannel.sendBinaryChunk({
            fileId,
            chunkIndex,
            totalChunks,
            blob: chunkBlob
          });

          // 更新进度
          const progress = Math.floor((end / totalSize) * 100);
          onProgress(progress);

          // Safari兼容性延迟
          await new Promise(resolve => setTimeout(resolve, 50));
        } catch (error) {
          console.error(`块 ${chunkIndex} 上传失败:`, error);
          throw new Error(`上传失败，块索引: ${chunkIndex}`);
        }
      }
    }

    // 添加打开视频详情的函数
    async function openVideoDetail(video) {
      // 保存当前编辑的视频
      state.currentEditingVideo = video;

      // 填充表单数据
      elements.videoTitle.value = video.title;
      elements.videoRemark.value = video.remark || '';
      state.selectedTagIdsForUpload = [...video.tagIds];

      // 显示视频预览
      const thumbnailData = await flutterChannel.getThumbnail(video.id);
      if (thumbnailData && thumbnailData.videoUrl) {
        elements.videoPreview.src = thumbnailData.videoUrl;
      }

      // 更新浮框标题
      document.querySelector('#upload-modal h3').textContent = '视频详情';

      // 更新按钮文本
      elements.saveVideoBtn.textContent = '保存修改';

      // 更新视频信息显示
      elements.videoSize.textContent = `大小: ${formatFileSize(video.fileSize)}`;
      elements.videoDuration.textContent = `时长: ${formatDuration(video.duration)}`;

      // 注入视频播放地址
      try {
        // 对于已保存的视频，使用视频文件路径获取可播放的URL
        const videoData = await flutterChannel.getVideoUrl(video.id);
        if (videoData && videoData.videoUrl) {
          elements.videoPreview.src = videoData.videoUrl;
        }
      } catch (error) {
        console.error('获取视频播放地址失败:', error);
      }

      // 显示浮框
      elements.uploadFirstBtn.classList.add('hidden');
      elements.uploadModal.classList.remove('hidden');

      // 加载并渲染标签
      await loadTags();
      renderTagSelection();
    }

    // 绑定所有事件处理程序
    function bindEvents() {
      // 视频卡片点击事件
      elements.videoGrid.addEventListener('click', async (e) => {
        const videoCard = e.target.closest('[data-video-id]');
        if (videoCard) {
          const videoId = videoCard.dataset.videoId;
          const video = state.videos.find(v => v.id === videoId);
          if (video) {
            await openVideoDetail(video);
          }
        }
      });

      // 上传按钮点击事件
      elements.uploadBtn.addEventListener('click', () => {
        elements.fileInput.click();
      });

      // 文件选择事件
      elements.fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFileSelection(e.target.files[0]);
          // 重置输入值，允许重复选择同一文件
          e.target.value = '';
        }
      });

      // 本地筛选框输入事件（实时筛选）
      elements.filterInput.addEventListener('input', renderVideoGrid);

      // 顶部搜索框回车事件（调用后端搜索）
      elements.searchInput.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
          const searchTerm = elements.searchInput.value.trim();
          if (searchTerm) {
            // 显示加载状态
            elements.videoGrid.innerHTML = `
              <div class="text-center text-gray-500 py-12">
                <i class="fa fa-spinner fa-spin text-4xl mb-4"></i>
                <p>正在搜索视频...</p>
              </div>
            `;

            try {
              // 调用后端搜索接口
              const searchResults = await flutterChannel.searchVideos(searchTerm);
              // 保存原始视频列表，方便后续筛选恢复
              state.originalVideos = state.videos;
              // 使用搜索结果更新视频列表
              state.videos = searchResults;
              // 清空标签筛选
              state.selectedTagIds = [];
              // 重新渲染
              renderVideoGrid();
              // renderTagFilters();
            } catch (error) {
              console.error('搜索失败:', error);
              elements.videoGrid.innerHTML = `
                <div class="text-center text-gray-500 py-12">
                  <i class="fa fa-exclamation-triangle text-4xl mb-4 text-red-500"></i>
                  <p>搜索失败，请重试</p>
                </div>
              `;
            }
          } else {
            // 搜索框为空时恢复原始视频列表
            if (state.originalVideos) {
              state.videos = state.originalVideos;
              state.originalVideos = null;
              renderVideoGrid();
            }
          }
        }
      });

      // 关闭上传浮框
      elements.closeUploadModal.addEventListener('click', () => {
        if (state.currentUploadFile) {
          elements.confirmModal.classList.remove('hidden');
        } else if (state.currentEditingVideo) {
          // 检查是否有修改
          const hasChanges =
            state.currentEditingVideo.title !== elements.videoTitle.value.trim() ||
            (state.currentEditingVideo.remark || '') !== elements.videoRemark.value.trim() ||
            JSON.stringify(state.currentEditingVideo.tagIds) !== JSON.stringify(state.selectedTagIdsForUpload);

          if (hasChanges) {
            elements.confirmModal.classList.remove('hidden');
          } else {
            elements.uploadModal.classList.add('hidden');
            state.currentEditingVideo = null;
          }
        } else {
          elements.uploadModal.classList.add('hidden');
        }
      });

      // 绑定先上传按钮事件
      elements.uploadFirstBtn.addEventListener('click', async () => {
        if (!state.currentUploadFile) {
          alert('未找到视频文件，请重新选择');
          return;
        }

        // 准备上传数据
        const videoFile = state.currentUploadFile;
        const fileId = 'video_' + Date.now();
        state.currentFileId = fileId;

        // 显示进度条
        document.getElementById('upload-progress-container').classList.remove('hidden');
        const progressBar = document.getElementById('upload-progress-bar');
        progressBar.style.width = '0%';

        try {
          // 初始化上传
          await flutterChannel._sendRequest('initBinaryUpload', {
            fileId,
            fileName: videoFile.name,
            totalSize: videoFile.size,
            mimeType: videoFile.type
          });

          // 分块上传
          await uploadChunks(videoFile, fileId, (progress) => {
            progressBar.style.width = `${progress}%`;
          });

          // 保存到待处理上传列表
          state.pendingUploads.set(fileId, {
            file: videoFile,
            uploaded: true
          });

          showToast('视频预上传已完成，可继续填写信息并保存');
        } catch (error) {
          console.error('预上传失败:', error);
          showToast('预上传失败: ' + error.message);
        }
      });

      // 取消上传按钮
      elements.cancelUploadBtn.addEventListener('click', () => {
        elements.confirmModal.classList.remove('hidden');
      });

      // 确认取消对话框 - 继续编辑
      elements.confirmCancelBtn.addEventListener('click', () => {
        elements.confirmModal.classList.add('hidden');
      });

      // 确认取消对话框 - 确认取消
      elements.confirmOkBtn.addEventListener('click', () => {
        // 清除视频预览
        elements.videoPreview.src = '';
        if (elements.videoPreview.src) {
          URL.revokeObjectURL(elements.videoPreview.src);
        }

        // 如果有已上传但未合并的文件，通知后端删除
        if (state.currentFileId && state.pendingUploads.has(state.currentFileId)) {
          try {
            flutterChannel._sendRequest('cancelBinaryUpload', {
              fileId: state.currentFileId
            });
            state.pendingUploads.delete(state.currentFileId);
          } catch (error) {
            console.error('取消上传失败:', error);
          }
        }

        // 重置状态
        state.currentUploadFile = null;
        state.currentFileId = null;
        state.selectedTagIdsForUpload = [];

        // 关闭对话框
        elements.confirmModal.classList.add('hidden');
        elements.uploadModal.classList.add('hidden');
      });

      // 保存视频按钮
      elements.saveVideoBtn.addEventListener('click', saveVideo);

      // 模态框外部点击关闭
      elements.uploadModal.addEventListener('click', (e) => {
        if (e.target === elements.uploadModal && state.currentUploadFile) {
          elements.confirmModal.classList.remove('hidden');
        }
      });

      elements.confirmModal.addEventListener('click', (e) => {
        if (e.target === elements.confirmModal) {
          elements.confirmModal.classList.add('hidden');
        }
      });

      // 浮框中添加标签按钮
      elements.addTagBtnModal.addEventListener('click', async () => {
        const tagName = elements.newTagInputModal.value.trim();
        if (tagName) {
          try {
            // 检查标签是否已存在
            const existingTag = state.tags.find(t => t.name.toLowerCase() === tagName.toLowerCase());
            if (existingTag) {
              // 已存在则直接选中
              if (!state.selectedTagIdsForUpload.includes(existingTag.id)) {
                state.selectedTagIdsForUpload.push(existingTag.id);
              }
              elements.newTagInputModal.value = '';
              renderTagSelection();
              return;
            }



            // 对不存在的标签进行添加
            const newTag = await flutterChannel.addTag(tagName);
            // 更新本地标签列表
            state.tags.push(newTag);
            state.selectedTagIdsForUpload.push(newTag.id);
            // 清空输入框
            elements.newTagInputModal.value = '';
            // 重新渲染标签选择区域
            renderTagSelection();
          } catch (error) {
            console.error('添加标签失败:', error);
            alert(`添加标签失败: ${error.message || '未知错误'}`);
          }
        }
      });

      // 浮框中按Enter键添加标签
      elements.newTagInputModal.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          elements.addTagBtnModal.click();
        }
      });

      // 为每个视频卡片的删除按钮事件做绑定
      document.querySelectorAll('.delete-menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const videoId = btn.dataset.videoId;
          document.querySelectorAll('.delete-menu').forEach(menu => {
            menu.classList.add('hidden');
          });
          btn.nextElementSibling.classList.toggle('hidden');
        });
      });

      // 点击删除按钮
      document.addEventListener('click', (e) => {
        if (e.target.closest('.delete-video-btn')) {
          const btn = e.target.closest('.delete-video-btn');
          const videoId = btn.dataset.videoId;
          if (confirm('确定要删除这个视频吗？')) {
            flutterChannel.deleteVideo(videoId).then(() => {
              showToast('删除成功');
              loadVideos();
            });
          }
          btn.closest('.delete-menu').classList.add('hidden');
        } else if (!e.target.closest('.delete-menu-btn') && !e.target.closest('.delete-menu')) {
          document.querySelectorAll('.delete-menu').forEach(menu => {
            menu.classList.add('hidden');
          });
        }
      });
    }

    // 工具函数：格式化时长
    function formatDuration(seconds) {
      if (!seconds) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 工具函数：格式化文件大小
    function formatFileSize(bytes) {
      if (bytes <= 0) return "0 B";
      const suffixes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(2)} ${suffixes[i]}`;
    }

    // 工具函数：格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString();
    }

    // 工具函数：显示操作成功提示框
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }


    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频管理系统 - 入口选择</title>
  <!-- 引入本地Tailwind CSS用于快速构建UI -->
  <link rel="stylesheet" href="css/output.css">
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 dark:text-white">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md dark:bg-gray-800 dark:text-white">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary dark:text-blue-400">视频管理系统 - 入口选择</h1>
      
      <!-- 导航链接 -->
      <div class="flex space-x-4">
        <button id="theme-toggle" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="切换深色模式">
          <i class="fa fa-moon-o text-gray-700 dark:text-yellow-300"></i>
        </button>
        <button id="logout-btn" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="登出">
          <i class="fa fa-sign-out text-gray-700 dark:text-gray-300"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
      <div class="bg-white rounded-xl p-8 shadow-md text-center dark:bg-gray-800 dark:text-white">
        <i class="fa fa-rocket text-6xl text-primary mb-6"></i>
        <h2 class="text-3xl font-bold mb-4">欢迎访问视频管理系统</h2>
        <p class="text-lg text-gray-600 mb-8 dark:text-gray-300">
          请选择您要访问的页面
        </p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 原始主页入口 -->
          <a href="index.html" class="bg-blue-50 p-6 rounded-lg border-2 border-blue-200 hover:border-blue-400 transition cursor-pointer dark:bg-blue-900/30 dark:border-blue-800 dark:hover:border-blue-600">
            <i class="fa fa-home text-4xl text-blue-500 mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">原始主页</h3>
            <p class="text-gray-600 mb-4 dark:text-gray-300">
              访问原来的视频管理主页，包含完整的视频管理功能
            </p>
            <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">
              进入主页
            </button>
          </a>
          
          <!-- 价格计算器页面入口 -->
          <a href="price_calculator.html" class="bg-green-50 p-6 rounded-lg border-2 border-green-200 hover:border-green-400 transition cursor-pointer dark:bg-green-900/30 dark:border-green-800 dark:hover:border-green-600">
            <i class="fa fa-calculator text-4xl text-green-500 mb-4"></i>
            <h3 class="text-xl font-semibold mb-2">价格计算器</h3>
            <p class="text-gray-600 mb-4 dark:text-gray-300">
              访问机器及零部件价格计算器
            </p>
            <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">
              进入计算器
            </button>
          </a>
        </div>
        
        <!-- 管理员入口（只对管理员显示） -->
        <div id="admin-section" class="mt-6 hidden">
          <h3 class="text-xl font-semibold mb-3 text-center">管理员功能</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 用户管理入口 -->
            <a href="user_management.html" class="bg-purple-50 p-6 rounded-lg border-2 border-purple-200 hover:border-purple-400 transition cursor-pointer dark:bg-purple-900/30 dark:border-purple-800 dark:hover:border-purple-600">
              <i class="fa fa-users text-4xl text-purple-500 mb-4"></i>
              <h3 class="text-xl font-semibold mb-2">用户管理</h3>
              <p class="text-gray-600 mb-4 dark:text-gray-300">
                管理系统用户，包括创建、审批等功能
              </p>
              <button class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg transition">
                进入用户管理
              </button>
            </a>
          </div>
        </div>
        
        <div class="mt-8 bg-gray-100 rounded-lg p-6 dark:bg-gray-700">
          <h3 class="text-lg font-semibold mb-3">系统信息</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
            <div class="bg-white p-3 rounded dark:bg-gray-600">
              <i class="fa fa-server text-blue-500 mr-2"></i>
              <span>服务器端口: <span id="serverPort" class="font-mono">8080</span></span>
            </div>
            <div class="bg-white p-3 rounded dark:bg-gray-600">
              <i class="fa fa-link text-green-500 mr-2"></i>
              <span>当前页面: 入口选择</span>
            </div>
            <div class="bg-white p-3 rounded dark:bg-gray-600">
              <i class="fa fa-clock-o text-yellow-500 mr-2"></i>
              <span id="currentTime">--:--:--</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="container mx-auto px-4 py-6 text-center text-gray-500 dark:text-gray-400">
    <p>视频管理系统 - 入口页面 &copy; 2025</p>
  </footer>

  <script>
    // API客户端
    const apiClient = {
      async request(endpoint, options = {}) {
        const url = `/api${endpoint}`;
        const config = {
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          },
          ...options
        };

        try {
          const response = await fetch(url, config);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
          }

          return data;
        } catch (error) {
          console.error(`API请求失败 ${url}:`, error);
          throw error;
        }
      }
    };
    
    // 检查用户会话和角色
    async function checkUserSession() {
      try {
        // 检查是否有会话ID
        const sessionId = localStorage.getItem('sessionId');
        if (!sessionId) {
          // 没有会话ID，重定向到登录页面
          window.location.href = 'auth.html';
          return;
        }
        
        // 有会话ID，验证会话是否仍然有效
        // 使用更安全的API端点，只返回当前用户信息
        try {
          const response = await fetch('/api/current-user-info', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ sessionId: sessionId })
          });
          
          if (!response.ok) {
            // 如果API返回错误，可能是会话已过期，重定向到登录页面
            window.location.href = 'auth.html';
            return;
          }
          
          const result = await response.json();
          if (result.success && result.user) {
            // 会话有效，检查当前用户角色
            if (result.user.role === 'admin') {
              // 如果是管理员，显示管理员功能
              const adminSection = document.getElementById('admin-section');
              if (adminSection) {
                adminSection.classList.remove('hidden');
              }
            }
            
            // 隐藏身份验证入口（因为用户已登录）
            hideAuthCard();
          } else {
            // 如果获取用户信息失败，也重定向到登录页面
            window.location.href = 'auth.html';
            return;
          }
        } catch (apiError) {
          console.error('验证会话失败:', apiError);
          // API请求失败，重定向到登录页面
          window.location.href = 'auth.html';
          return;
        }
      } catch (error) {
        console.error('检查用户会话失败:', error);
        window.location.href = 'auth.html';
      }
    }
    
    // 隐藏身份验证入口
    function hideAuthCard() {
      const authCard = document.querySelector('.bg-yellow-50 p-6.rounded-lg.border-2.border-yellow-200');
      if (authCard) {
        authCard.style.display = 'none';
      }
    }

    // 更新时间
    function updateTime() {
      const now = new Date();
      document.getElementById('currentTime').textContent = now.toLocaleTimeString();
    }
    
    // 获取当前用户信息
    async function getCurrentUser() {
      try {
        const response = await fetch('/api/users', {
          headers: {
            'Content-Type': 'application/json',
          }
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const result = await response.json();
        if (result.success) {
          const sessionId = localStorage.getItem('sessionId');
          // 通过sessionId查找当前用户（这里我们简化处理，实际应该通过API验证session）
          // 暂时通过用户名查找
          const username = localStorage.getItem('username');
          if (username) {
            return result.data.find(user => user.username === username);
          }
        }
      } catch (error) {
        console.error('获取当前用户信息失败:', error);
        return null;
      }
    }
    
    // 初始化时间并设置定时器
    updateTime();
    setInterval(updateTime, 1000);
    
    // 深色模式切换功能
    const themeToggle = document.getElementById('theme-toggle');
    const iconElement = themeToggle.querySelector('i');
    
    // 从localStorage获取主题偏好
    let theme = localStorage.getItem('theme') || 'light';
    
    // 应用主题
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      iconElement.className = 'fa fa-sun-o text-yellow-300';
    } else {
      document.documentElement.classList.remove('dark');
      iconElement.className = 'fa fa-moon-o text-gray-700 dark:text-gray-300';
    }
    
    // 切换主题
    themeToggle.addEventListener('click', () => {
      if (theme === 'light') {
        theme = 'dark';
        document.documentElement.classList.add('dark');
        iconElement.className = 'fa fa-sun-o text-yellow-300';
      } else {
        theme = 'light';
        document.documentElement.classList.remove('dark');
        iconElement.className = 'fa fa-moon-o text-gray-700 dark:text-gray-300';
      }
      // 保存用户偏好到localStorage
      localStorage.setItem('theme', theme);
    });
    
    // 为卡片添加点击事件（除了链接本身） 
    document.querySelectorAll('.bg-blue-50, .bg-green-50').forEach(card => {
      card.addEventListener('click', function(e) {
        // 如果点击的是按钮，不触发导航
        if (e.target.tagName === 'BUTTON') {
          return;
        }
        // 否则导航到卡片的链接目标
        const link = this.closest('a');
        if (link) {
          window.location.href = link.href;
        }
      });
    });
    
        
    
        // 登出功能
    
        async function logout() {
    
          try {
    
            // 从localStorage中获取sessionId
    
            const sessionId = localStorage.getItem('sessionId');
    
            
    
            if (sessionId) {
    
              // 调用后端API登出（可选，清理服务器端会话）
    
              await apiClient.request('/users/logout', {
    
                method: 'POST',
    
                body: JSON.stringify({ sessionId: sessionId })
    
              }).catch(error => {
    
                // 如果登出API调用失败，也不影响本地登出
    
                console.warn('登出API调用失败:', error);
    
              });
    
            }
    
            
    
            // 清除本地存储的会话信息
    
            localStorage.removeItem('sessionId');
    
            localStorage.removeItem('username');
    
            
    
            // 重定向到登录页面
    
            window.location.href = 'auth.html';
    
          } catch (error) {
    
            console.error('登出过程中发生错误:', error);
    
            // 即使出错也清除本地会话并重定向
    
            localStorage.removeItem('sessionId');
    
            localStorage.removeItem('username');
    
            window.location.href = 'auth.html';
    
          }
    
        }
    
        
    
        // 绑定登出按钮事件
    
        document.getElementById('logout-btn').addEventListener('click', logout);
    
    
    
        // 页面加载完成后检查用户会话
        document.addEventListener('DOMContentLoaded', async function() {
          // 检查用户会话，如果未登录则自动跳转到auth页面
          await checkUserSession();
        });
  </script>
</body>
</html>

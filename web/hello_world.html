<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - 视频管理Web端</title>
  <!-- 引入Tailwind CSS用于快速构建UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  
  <!-- 配置Tailwind自定义颜色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
        },
      }
    }
  </script>

  <!-- 配置Tailwind深色模式 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
        },
      }
    }
  </script>
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 dark:text-white">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md dark:bg-gray-800 dark:text-white">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary dark:text-blue-400">Hello World 测试页面</h1>
      
      <!-- 导航链接 -->
      <div class="flex space-x-4">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
          <i class="fa fa-home mr-1"></i> 主页
        </a>
        <button id="theme-toggle" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="切换深色模式">
          <i class="fa fa-moon-o text-gray-700 dark:text-yellow-300"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-xl p-8 shadow-md text-center dark:bg-gray-800 dark:text-white">
      <i class="fa fa-globe text-6xl text-primary mb-6"></i>
      <h2 class="text-3xl font-bold mb-4">Hello, World!</h2>
      <p class="text-lg text-gray-600 mb-6 dark:text-gray-300">
        欢迎访问视频管理系统的测试页面
      </p>
      <div class="bg-gray-100 rounded-lg p-6 mb-6 dark:bg-gray-700">
        <p class="text-gray-700 mb-2 dark:text-gray-300">
          <i class="fa fa-check-circle text-green-500 mr-2"></i>
          新页面创建成功！
        </p>
        <p class="text-gray-700 mb-2 dark:text-gray-300">
          <i class="fa fa-plug text-blue-500 mr-2"></i>
          可以通过 <code class="bg-gray-200 px-2 py-1 rounded dark:bg-gray-600">http://服务器IP:端口/hello_world.html</code> 访问
        </p>
        <p class="text-gray-700 dark:text-gray-300">
          <i class="fa fa-lightbulb-o text-yellow-500 mr-2"></i>
          这是视频管理系统客户端访问网页功能的扩展示例
        </p>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div class="bg-blue-50 p-4 rounded-lg dark:bg-blue-900/30">
          <i class="fa fa-file-video-o text-3xl text-blue-500 mb-2"></i>
          <h3 class="font-semibold">视频管理</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400">管理您的视频文件</p>
        </div>
        <div class="bg-green-50 p-4 rounded-lg dark:bg-green-900/30">
          <i class="fa fa-tags text-3xl text-green-500 mb-2"></i>
          <h3 class="font-semibold">标签系统</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400">为视频添加标签</p>
        </div>
        <div class="bg-purple-50 p-4 rounded-lg dark:bg-purple-900/30">
          <i class="fa fa-server text-3xl text-purple-500 mb-2"></i>
          <h3 class="font-semibold">服务端通信</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400">WebSocket连接</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="container mx-auto px-4 py-6 text-center text-gray-500 dark:text-gray-400">
    <p>视频管理系统 - 测试页面 &copy; 2025</p>
  </footer>

  <script>
    // 深色模式切换功能
    const themeToggle = document.getElementById('theme-toggle');
    const iconElement = themeToggle.querySelector('i');
    
    // 从localStorage获取主题偏好
    let theme = localStorage.getItem('theme') || 'light';
    
    // 应用主题
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      iconElement.className = 'fa fa-sun-o text-yellow-300';
    } else {
      document.documentElement.classList.remove('dark');
      iconElement.className = 'fa fa-moon-o text-gray-700 dark:text-gray-300';
    }
    
    // 切换主题
    themeToggle.addEventListener('click', () => {
      if (theme === 'light') {
        theme = 'dark';
        document.documentElement.classList.add('dark');
        iconElement.className = 'fa fa-sun-o text-yellow-300';
      } else {
        theme = 'light';
        document.documentElement.classList.remove('dark');
        iconElement.className = 'fa fa-moon-o text-gray-700 dark:text-gray-300';
      }
      // 保存用户偏好到localStorage
      localStorage.setItem('theme', theme);
    });
  </script>
</body>
</html>

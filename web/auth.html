<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/绑定TOTP - 视频管理系统</title>
  <!-- 引入本地Tailwind CSS -->
  <link rel="stylesheet" href="css/output.css">
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  
  <!-- 引入QRCode库 -->
  <script src="qrcode.min.js"></script>
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 dark:text-white">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md dark:bg-gray-800 dark:text-white">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary dark:text-blue-400">视频管理系统 - 身份验证</h1>
      
      <!-- 导航链接 -->
      <div class="flex space-x-4">
        <button id="theme-toggle" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="切换深色模式">
          <i class="fa fa-moon-o text-gray-700 dark:text-yellow-300"></i>
        </button>
        <a href="entry.html" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">
          <i class="fa fa-home text-gray-700 dark:text-gray-300"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
      <div class="bg-white rounded-xl p-8 shadow-md text-center dark:bg-gray-800 dark:text-white">
        <i class="fa fa-shield text-6xl text-primary mb-6"></i>
        <h2 class="text-3xl font-bold mb-4">身份验证</h2>
        <p class="text-lg text-gray-600 mb-8 dark:text-gray-300">
          请选择您要进行的操作
        </p>
        
        <div class="mb-8" id="login-section">
          <h3 class="text-xl font-semibold mb-4">登录</h3>
          <div class="space-y-4">
            <div>
              <label for="login-username" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">用户名</label>
              <input type="text" id="login-username" placeholder="输入用户名" 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 dark:bg-gray-600 dark:text-white dark:border-gray-500">
            </div>
            <div>
              <label for="login-code" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">TOTP验证码</label>
              <input type="text" id="login-code" placeholder="输入6位验证码" maxlength="6"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 dark:bg-gray-600 dark:text-white dark:border-gray-500">
            </div>
            <button id="login-btn" 
              class="w-full bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
              <i class="fa fa-sign-in mr-2"></i>登录
            </button>
          </div>
        </div>
        
        <div class="border-t my-6 dark:border-gray-700"></div>
        
        <!-- 绑定TOTP验证器入口 -->
        <div id="binding-entry-section" class="mb-6">
          <h3 class="text-xl font-semibold mb-4">绑定TOTP验证器</h3>
          <div class="text-center">
            <button id="show-binding-btn" 
              class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300">
              点击此处绑定TOTP验证器
            </button>
          </div>
        </div>
        
        <!-- 绑定TOTP验证器表单（初始隐藏） -->
        <div id="binding-section" class="hidden">
          <h3 class="text-xl font-semibold mb-4">绑定TOTP验证器</h3>
          <div class="space-y-4">
            <div>
              <label for="bind-username" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">用户名</label>
              <input type="text" id="bind-username" placeholder="输入用户名" 
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 dark:bg-gray-600 dark:text-white dark:border-gray-500">
            </div>
            <button id="bind-generate-btn" 
              class="w-full bg-secondary text-white px-4 py-2 rounded-lg hover:bg-secondary/90 transition dark:bg-green-600 dark:hover:bg-green-700">
              <i class="fa fa-qrcode mr-2"></i>生成绑定二维码
            </button>
          </div>
          
          <!-- 绑定界面（初始隐藏） -->
          <div id="bind-qr-section" class="hidden mt-6 p-4 bg-gray-50 rounded-lg dark:bg-gray-700">
            <h4 class="text-lg font-semibold mb-3">绑定TOTP验证器</h4>
            <p class="text-gray-600 mb-4 dark:text-gray-300">
              请使用微软 Authenticator 或其他TOTP应用扫描下方二维码，然后输入6位验证码完成绑定
            </p>
            <div id="qr-container" class="flex justify-center mb-4">
              <!-- 二维码将通过JavaScript动态生成 -->
            </div>
            <div class="mb-4">
              <label for="bind-verification-code" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">验证码</label>
              <input type="text" id="bind-verification-code" placeholder="输入6位验证码" maxlength="6"
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 dark:bg-gray-600 dark:text-white dark:border-gray-500">
            </div>
            <button id="bind-verify-btn" 
              class="w-full bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
              <i class="fa fa-check-circle mr-2"></i>验证并绑定
            </button>
            <button id="bind-cancel-btn" class="w-full mt-2 text-gray-500 hover:text-gray-700 dark:text-gray-300 dark:hover:text-gray-100">
              <i class="fa fa-times mr-2"></i>取消绑定
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 操作成功提示框 toast -->
  <div id="toast"
    class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
    操作成功
  </div>

  <script>
    // API客户端
    const apiClient = {
      async request(endpoint, options = {}) {
        const url = `/api${endpoint}`;
        const config = {
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          },
          ...options
        };

        try {
          const response = await fetch(url, config);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
          }

          return data;
        } catch (error) {
          console.error(`API请求失败 ${url}:`, error);
          throw error;
        }
      }
    };

    // DOM元素引用
    const elements = {
      loginUsername: document.getElementById('login-username'),
      loginCode: document.getElementById('login-code'),
      loginBtn: document.getElementById('login-btn'),
      
      bindUsername: document.getElementById('bind-username'),
      bindGenerateBtn: document.getElementById('bind-generate-btn'),
      bindQrSection: document.getElementById('bind-qr-section'),
      qrContainer: document.getElementById('qr-container'),
      bindVerificationCode: document.getElementById('bind-verification-code'),
      bindVerifyBtn: document.getElementById('bind-verify-btn'),
      bindCancelBtn: document.getElementById('bind-cancel-btn'),
      
      // 新增元素
      bindingEntrySection: document.getElementById('binding-entry-section'),
      showBindingBtn: document.getElementById('show-binding-btn'),
      bindingSection: document.getElementById('binding-section'),
      
      themeToggle: document.getElementById('theme-toggle'),
      toast: document.getElementById('toast')
    };

    // 当前绑定用户和密钥
    let currentBindUser = '';
    let currentBindSecret = '';

    // 生成二维码（使用本地qrcode库）
    function generateQRCode(data, size = 200) {
      return new Promise((resolve, reject) => {
        // 创建一个临时div元素供qrcode库使用
        const tempDiv = document.createElement('div');
        tempDiv.style.display = 'inline-block';
        tempDiv.style.overflow = 'hidden';
        tempDiv.style.width = size + 'px';
        tempDiv.style.height = size + 'px';
        // 将div添加到页面中，以便能够获取其内容
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        document.body.appendChild(tempDiv);
        
        try {
          // 尝试生成二维码，处理可能的数据溢出
          // 创建QRCode实例
          const qr = new QRCode(tempDiv, {
            text: data,
            width: size,
            height: size,
            colorDark: "#000000",
            colorLight: "#FFFFFF",
            correctLevel: QRCode.CorrectLevel.H  // 高纠错级别，提供更好的容错能力
          });
          
          // 更新二维码（这会触发生成）
          qr.makeCode(data);
          
          // 等待DOM更新后处理
          setTimeout(() => {
            // 查找生成的二维码元素
            const qrElement = tempDiv.querySelector('canvas') || tempDiv.querySelector('img') || tempDiv.querySelector('table') || tempDiv.querySelector('svg');
            
            if (qrElement) {
              if (qrElement.tagName === 'CANVAS') {
                // 如果是canvas元素，直接获取data URL
                const dataUrl = qrElement.toDataURL();
                document.body.removeChild(tempDiv); // 清理临时元素
                resolve(dataUrl);
              } else if (qrElement.tagName === 'SVG') {
                // 如果是SVG元素，转换为canvas
                const svgData = new XMLSerializer().serializeToString(qrElement);
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // 设置白色背景
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, size, size);
                
                // 创建一个临时的SVG Blob URL
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const svgUrl = URL.createObjectURL(svgBlob);
                
                const img = new Image();
                img.onload = function() {
                  try {
                    ctx.drawImage(img, 0, 0, size, size);
                    const dataUrl = canvas.toDataURL();
                    URL.revokeObjectURL(svgUrl); // 释放对象URL
                    document.body.removeChild(tempDiv); // 清理临时元素
                    resolve(dataUrl);
                  } catch (e) {
                    console.error('绘制SVG到canvas失败', e);
                    document.body.removeChild(tempDiv);
                    reject(e);
                  }
                };
                
                img.onerror = function() {
                  console.error('SVG加载失败');
                  URL.revokeObjectURL(svgUrl);
                  document.body.removeChild(tempDiv);
                  reject(new Error('SVG加载失败'));
                };
                
                img.src = svgUrl;
              } else if (qrElement.tagName === 'IMG') {
                // 如果是img元素，绘制到canvas
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // 设置白色背景
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, size, size);
                
                const img = qrElement;
                ctx.drawImage(img, 0, 0, size, size);
                
                const dataUrl = canvas.toDataURL();
                document.body.removeChild(tempDiv);
                resolve(dataUrl);
              } else {
                // 如果是表格元素（老版本库可能使用表格）
                // 创建一个canvas，并将表格内容转换为canvas
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                
                // 设置白色背景
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, size, size);
                
                // 由于表格无法直接转换，我们创建一个简单方案
                // 借助html2canvas库可以实现（不过此处未引入该库）
                // 因此我们保留DOM结构，获取其尺寸，然后移除
                document.body.removeChild(tempDiv);
                
                // 针对表格格式的QR码，我们用最兼容的方式实现
                // 首先尝试重新创建一个新的QR码对象并直接用canvas渲染
                const newTempDiv = document.createElement('div');
                newTempDiv.style.width = size + 'px';
                newTempDiv.style.height = size + 'px';
                newTempDiv.style.position = 'absolute';
                newTempDiv.style.left = '-9999px';
                document.body.appendChild(newTempDiv);
                
                const newQr = new QRCode(newTempDiv, {
                  text: data,
                  width: size,
                  height: size,
                  colorDark: "#000000",
                  colorLight: "#FFFFFF",
                  correctLevel: QRCode.CorrectLevel.M  // 中等纠错级别
                });
                
                newQr.makeCode(data);
                
                // 确保渲染完成后再处理
                setTimeout(() => {
                  const newQrElement = newTempDiv.querySelector('canvas, svg, img');
                  if (newQrElement && newQrElement.tagName === 'CANVAS') {
                    const dataUrl = newQrElement.toDataURL();
                    document.body.removeChild(newTempDiv);
                    resolve(dataUrl);
                  } else {
                    // 如果还是不行，创建一个备用的canvas
                    const fallbackCanvas = document.createElement('canvas');
                    fallbackCanvas.width = size;
                    fallbackCanvas.height = size;
                    const fallbackCtx = fallbackCanvas.getContext('2d');
                    fallbackCtx.fillStyle = '#FFFFFF';
                    fallbackCtx.fillRect(0, 0, size, size);
                    fallbackCtx.fillStyle = '#000000';
                    fallbackCtx.font = '10px Arial';
                    fallbackCtx.textAlign = 'center';
                    fallbackCtx.textBaseline = 'middle';
                    fallbackCtx.fillText('二维码', size/2, size/2 - 10);
                    fallbackCtx.fillText('生成中...', size/2, size/2 + 10);
                    
                    document.body.removeChild(newTempDiv);
                    resolve(fallbackCanvas.toDataURL());
                  }
                }, 50);
              }
            } else {
              // 如果没有找到二维码元素，创建一个备用的canvas
              document.body.removeChild(tempDiv);
              const fallbackCanvas = document.createElement('canvas');
              fallbackCanvas.width = size;
              fallbackCanvas.height = size;
              const fallbackCtx = fallbackCanvas.getContext('2d');
              fallbackCtx.fillStyle = '#FFFFFF';
              fallbackCtx.fillRect(0, 0, size, size);
              fallbackCtx.fillStyle = '#000000';
              fallbackCtx.font = '10px Arial';
              fallbackCtx.textAlign = 'center';
              fallbackCtx.textBaseline = 'middle';
              fallbackCtx.fillText('二维码', size/2, size/2 - 10);
              fallbackCtx.fillText('生成中...', size/2, size/2 + 10);
              resolve(fallbackCanvas.toDataURL());
            }
          }, 50); // 短暂延迟以确保DOM更新
        } catch (error) {
          // 检查是否是数据长度溢出错误
          if (error.message && error.message.includes('code length overflow')) {
            console.warn('二维码数据长度溢出，尝试简化内容');
            // 对于溢出情况，提供简化处理
            document.body.removeChild(tempDiv);
            
            // 创建一个备用的canvas，并显示简化信息
            const fallbackCanvas = document.createElement('canvas');
            fallbackCanvas.width = size;
            fallbackCanvas.height = size;
            const fallbackCtx = fallbackCanvas.getContext('2d');
            fallbackCtx.fillStyle = '#FFFFFF';
            fallbackCtx.fillRect(0, 0, size, size);
            fallbackCtx.fillStyle = '#000000';
            fallbackCtx.font = '10px Arial';
            fallbackCtx.textAlign = 'center';
            fallbackCtx.textBaseline = 'middle';
            fallbackCtx.fillText('二维码数据过长', size/2, size/2 - 15);
            fallbackCtx.fillText('请手动输入密钥', size/2, size/2);
            fallbackCtx.fillText('或使用认证应用', size/2, size/2 + 15);
            
            resolve(fallbackCanvas.toDataURL());
          } else {
            console.error('生成二维码失败:', error);
            // 确保清理临时元素
            if (tempDiv.parentNode) {
              document.body.removeChild(tempDiv);
            }
            // 创建一个备用的canvas
            const fallbackCanvas = document.createElement('canvas');
            fallbackCanvas.width = size;
            fallbackCanvas.height = size;
            const fallbackCtx = fallbackCanvas.getContext('2d');
            fallbackCtx.fillStyle = '#FFFFFF';
            fallbackCtx.fillRect(0, 0, size, size);
            fallbackCtx.fillStyle = '#000000';
            fallbackCtx.font = '12px Arial';
            fallbackCtx.textAlign = 'center';
            fallbackCtx.textBaseline = 'middle';
            fallbackCtx.fillText('QR生成失败', size/2, size/2);
            resolve(fallbackCanvas.toDataURL());
          }
        }
      });
    }

    // 初始化函数
    async function init() {
      // 初始化主题
      initTheme();
      
      // 绑定事件监听器
      bindEvents();
    }

    // 绑定事件
    function bindEvents() {
      elements.loginBtn.addEventListener('click', login);
      elements.bindGenerateBtn.addEventListener('click', generateTotpForBinding);
      elements.bindVerifyBtn.addEventListener('click', verifyBinding);
      elements.bindCancelBtn.addEventListener('click', cancelBinding);
      elements.themeToggle.addEventListener('click', toggleTheme);
      
      // 添加回车键导航功能
      elements.loginUsername.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          elements.loginCode.focus();
        }
      });
      
      elements.loginCode.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          login();
        }
      });
      
      // 绑定验证器相关输入框的回车键导航
      elements.bindUsername.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          elements.bindGenerateBtn.click();
        }
      });
      
      elements.bindVerificationCode.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          verifyBinding();
        }
      });
      
      // 绑定显示TOTP绑定功能的按钮
      elements.showBindingBtn.addEventListener('click', function() {
        elements.bindingEntrySection.classList.add('hidden');
        elements.bindingSection.classList.remove('hidden');
      });
    }

    // 登录
    async function login() {
      const username = elements.loginUsername.value.trim();
      const code = elements.loginCode.value.trim();

      if (!username) {
        showToast('请输入用户名', 'error');
        return;
      }

      if (!code || code.length !== 6) {
        showToast('请输入6位验证码', 'error');
        return;
      }

      try {
        const result = await apiClient.request('/users/authenticate', {
          method: 'POST',
          body: JSON.stringify({ username, code })
        });

        if (result.success && result.data.authenticated) {
          // 保存会话ID到localStorage
          if (result.data.sessionId) {
            localStorage.setItem('sessionId', result.data.sessionId);
          }
          // 保存用户名到localStorage
          localStorage.setItem('username', username);
          showToast('登录成功');
          // 登录成功后重定向到入口页面
          window.location.href = 'entry.html';
        } else {
          showToast('登录失败：验证码错误或用户状态异常', 'error');
        }
      } catch (error) {
        console.error('登录失败:', error);
        showToast('登录失败: ' + error.message, 'error');
      }
    }

    // 生成TOTP密钥用于绑定
    async function generateTotpForBinding() {
      const username = elements.bindUsername.value.trim();

      if (!username) {
        showToast('请输入用户名', 'error');
        return;
      }

      try {
        const result = await apiClient.request('/users/generate-totp', {
          method: 'POST',
          body: JSON.stringify({ username })
        });

        if (result.success) {
          currentBindUser = username;
          currentBindSecret = result.data.secret;
          
          // 显示绑定界面和二维码
          elements.bindQrSection.classList.remove('hidden');
          
          // 生成并显示二维码
          const qrCodeDataUrl = await generateQRCode(result.data.otpAuthUrl, 192);
          
          const qrCodeHtml = `
            <div class="bg-white p-4 rounded-lg inline-block">
              <p class="text-sm mb-2 font-mono break-all">${result.data.otpAuthUrl}</p>
              <div class="flex items-center justify-center">
                <img src="${qrCodeDataUrl}" alt="TOTP QR Code" class="w-48 h-48 border rounded" />
              </div>
              <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
                TOTP密钥: ${result.data.secret}
              </p>
            </div>
          `;
          
          elements.qrContainer.innerHTML = qrCodeHtml;
          
          showToast('TOTP密钥已生成，请扫描二维码完成绑定');
        } else {
          showToast(result.error || '生成TOTP密钥失败', 'error');
        }
      } catch (error) {
        console.error('生成TOTP密钥失败:', error);
        showToast('生成TOTP密钥失败: ' + error.message, 'error');
      }
    }

    // 验证绑定
    async function verifyBinding() {
      const code = elements.bindVerificationCode.value.trim();

      if (!code || code.length !== 6) {
        showToast('请输入6位验证码', 'error');
        return;
      }

      if (!currentBindUser) {
        showToast('请先生成绑定密钥', 'error');
        return;
      }

      try {
        const result = await apiClient.request('/users/verify-totp', {
          method: 'POST',
          body: JSON.stringify({ username: currentBindUser, code })
        });

        if (result.success && result.data.isValid) {
          showToast('绑定验证成功');
          
          // 根据用户角色提示下一步操作
          alert('绑定验证成功！\n\n- 管理员用户将立即激活并可使用系统\n- 普通用户需要等待管理员审批后才能登录');
          
          // 重置绑定界面
          cancelBinding();
        } else {
          showToast('验证码错误，请重试', 'error');
        }
      } catch (error) {
        console.error('验证绑定失败:', error);
        showToast('验证绑定失败: ' + error.message, 'error');
      }
    }

    // 取消绑定
    function cancelBinding() {
      elements.bindQrSection.classList.add('hidden');
      elements.bindVerificationCode.value = '';
      currentBindUser = '';
      currentBindSecret = '';
      
      // 重置表单
      elements.bindUsername.value = '';
      
      // 隐藏完整的绑定界面，显示入口按钮
      elements.bindingSection.classList.add('hidden');
      elements.bindingEntrySection.classList.remove('hidden');
    }

    // 工具函数：显示操作成功提示框
    function showToast(message, type = 'success') {
      const toast = elements.toast;
      toast.textContent = message;
      toast.className = toast.className.replace('bg-green-500', type === 'error' ? 'bg-red-500' : 'bg-green-500');
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    // 切换深色模式
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      
      // 更新图标
      updateThemeIcon();
    }

    // 更新主题图标
    function updateThemeIcon() {
      const iconElement = elements.themeToggle.querySelector('i');
      if (document.documentElement.classList.contains('dark')) {
        iconElement.className = 'fa fa-sun-o text-yellow-300';
      } else {
        iconElement.className = 'fa fa-moon-o text-gray-700 dark:text-gray-300';
      }
    }

    // 初始化主题
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcon();
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

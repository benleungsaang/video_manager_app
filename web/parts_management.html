<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>零件管理系统</title>
  <!-- 引入本地Tailwind CSS用于快速构建UI -->
  <link rel="stylesheet" href="css/output.css">
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  <style>
    /* 自定义滚动条样式 */
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #cbd5e0;
      border-radius: 3px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background-color: #a0aec0;
    }
    
    /* 表格行悬停效果 */
    .hover-row:hover {
      background-color: #f7fafc;
    }
    
    /* 模态框背景模糊效果 */
    .modal-backdrop {
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 dark:text-white">
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md dark:bg-gray-800 dark:text-white">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary dark:text-blue-400">零件管理系统</h1>
      
      <!-- 导航链接 -->
      <div class="flex space-x-4">
        <button id="theme-toggle" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="切换深色模式">
          <i class="fa fa-moon-o text-gray-700 dark:text-yellow-300"></i>
        </button>
        <button id="logout-btn" class="px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="登出">
          <i class="fa fa-sign-out text-gray-700 dark:text-gray-300"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="max-w-7xl mx-auto">
      <div class="bg-white rounded-xl p-6 shadow-md dark:bg-gray-800 dark:text-white">
        <!-- 标签页导航 -->
        <div class="border-b border-gray-200 dark:border-gray-700 mb-6">
          <nav class="flex space-x-8">
            <button id="machines-tab" class="tab-button py-4 px-6 border-b-2 font-medium text-sm active-tab border-primary text-primary dark:text-blue-400 dark:border-blue-400 bg-gray-100 dark:bg-gray-700 rounded-t-lg">机器管理</button>
            <button id="parts-tab" class="tab-button py-4 px-6 border-b-2 font-medium text-sm border-transparent hover:text-gray-700 hover:border-gray-300 dark:hover:text-gray-300 dark:hover:border-gray-500 rounded-t-lg">部件管理</button>
            <button id="fees-tab" class="tab-button py-4 px-6 border-b-2 font-medium text-sm border-transparent hover:text-gray-700 hover:border-gray-300 dark:hover:text-gray-300 dark:hover:border-gray-500 rounded-t-lg">费用管理</button>
            <button id="factors-tab" class="tab-button py-4 px-6 border-b-2 font-medium text-sm border-transparent hover:text-gray-700 hover:border-gray-300 dark:hover:text-gray-300 dark:hover:border-gray-500 rounded-t-lg">系数管理</button>
          </nav>
        </div>
        
        <!-- 机器管理内容 -->
        <div id="machines-content" class="tab-content">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold">机器管理</h2>
            <div class="flex space-x-3">
              <button id="add-machine-btn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
                <i class="fa fa-plus mr-1"></i> 添加机器
              </button>
              <button id="delete-selected-machines-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                <i class="fa fa-trash mr-1"></i> 批量删除
              </button>
            </div>
          </div>
          
          <!-- 搜索框 -->
          <div class="mb-6">
            <div class="relative">
              <input type="text" id="machine-search" placeholder="搜索机器型号或名称..." 
                class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600">
              <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-300"></i>
            </div>
          </div>
          
          <!-- 机器表格 -->
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
              <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">
                    <input type="checkbox" id="select-all-machines" class="rounded">
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">型号</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">名称</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">基础价格</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">操作</th>
                </tr>
              </thead>
              <tbody id="machines-table-body" class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <!-- 机器数据将通过JavaScript动态加载 -->
                <tr>
                  <td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- 部件管理内容 -->
        <div id="parts-content" class="tab-content hidden">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold">部件管理</h2>
            <div class="flex space-x-3">
              <button id="add-part-btn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
                <i class="fa fa-plus mr-1"></i> 添加部件
              </button>
              <button id="delete-selected-parts-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                <i class="fa fa-trash mr-1"></i> 批量删除
              </button>
            </div>
          </div>
          
          <!-- 搜索框 -->
          <div class="mb-6">
            <div class="relative">
              <input type="text" id="part-search" placeholder="搜索部件型号或名称..." 
                class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600">
              <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-300"></i>
            </div>
          </div>
          
          <!-- 部件表格 -->
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
              <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">
                    <input type="checkbox" id="select-all-parts" class="rounded">
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">型号</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">名称</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">基础价格</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">操作</th>
                </tr>
              </thead>
              <tbody id="parts-table-body" class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <!-- 部件数据将通过JavaScript动态加载 -->
                <tr>
                  <td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- 费用管理内容 -->
        <div id="fees-content" class="tab-content hidden">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold">费用管理</h2>
            <div class="flex space-x-3">
              <button id="add-fee-btn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
                <i class="fa fa-plus mr-1"></i> 添加费用
              </button>
              <button id="delete-selected-fees-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                <i class="fa fa-trash mr-1"></i> 批量删除
              </button>
            </div>
          </div>
          
          <!-- 搜索框 -->
          <div class="mb-6">
            <div class="relative">
              <input type="text" id="fee-search" placeholder="搜索费用名称..." 
                class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600">
              <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-300"></i>
            </div>
          </div>
          
          <!-- 费用表格 -->
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
              <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">
                    <input type="checkbox" id="select-all-fees" class="rounded">
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">费用名称</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">费用金额</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">操作</th>
                </tr>
              </thead>
              <tbody id="fees-table-body" class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <!-- 费用数据将通过JavaScript动态加载 -->
                <tr>
                  <td colspan="4" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        
        <!-- 系数管理内容 -->
        <div id="factors-content" class="tab-content hidden">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-semibold">系数管理</h2>
            <div class="flex space-x-3">
              <button id="add-factor-btn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
                <i class="fa fa-plus mr-1"></i> 添加系数
              </button>
              <button id="delete-selected-factors-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                <i class="fa fa-trash mr-1"></i> 批量删除
              </button>
            </div>
          </div>
          
          <!-- 搜索框 -->
          <div class="mb-6">
            <div class="relative">
              <input type="text" id="factor-search" placeholder="搜索系数名称..." 
                class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600">
              <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-300"></i>
            </div>
          </div>
          
          <!-- 系数表格 -->
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
              <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">
                    <input type="checkbox" id="select-all-factors" class="rounded">
                  </th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">系数名称</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">系数值</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:text-gray-300">操作</th>
                </tr>
              </thead>
              <tbody id="factors-table-body" class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <!-- 系数数据将通过JavaScript动态加载 -->
                <tr>
                  <td colspan="4" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 添加/编辑机器模态框 -->
  <div id="add-edit-machine-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50 dark:bg-black/70">
    <div class="bg-white rounded-xl w-full max-w-lg p-6 dark:bg-gray-800 dark:text-white">
      <div class="flex justify-between items-center mb-4">
        <h3 id="machine-modal-title" class="text-xl font-bold">添加机器</h3>
        <button id="close-machine-modal" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label for="machine-model" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">型号 <span class="text-red-500">*</span></label>
          <input type="text" id="machine-model" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入机器型号">
        </div>
        
        <div>
          <label for="machine-name" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">名称 <span class="text-red-500">*</span></label>
          <input type="text" id="machine-name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入机器名称">
        </div>
        
        <div>
          <label for="machine-price" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">基础价格 <span class="text-red-500">*</span></label>
          <input type="number" id="machine-price" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入基础价格" min="0" step="0.01">
        </div>
      </div>
      
      <div class="mt-6 flex justify-end space-x-3">
        <button id="cancel-machine-btn" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
          取消
        </button>
        <button id="save-machine-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- 添加/编辑部件模态框 -->
  <div id="add-edit-part-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50 dark:bg-black/70">
    <div class="bg-white rounded-xl w-full max-w-lg p-6 dark:bg-gray-800 dark:text-white">
      <div class="flex justify-between items-center mb-4">
        <h3 id="part-modal-title" class="text-xl font-bold">添加部件</h3>
        <button id="close-part-modal" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label for="part-model" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">型号 <span class="text-red-500">*</span></label>
          <input type="text" id="part-model" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入部件型号">
        </div>
        
        <div>
          <label for="part-name" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">名称 <span class="text-red-500">*</span></label>
          <input type="text" id="part-name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入部件名称">
        </div>
        
        <div>
          <label for="part-price" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">基础价格 <span class="text-red-500">*</span></label>
          <input type="number" id="part-price" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入基础价格" min="0" step="0.01">
        </div>
      </div>
      
      <div class="mt-6 flex justify-end space-x-3">
        <button id="cancel-part-btn" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
          取消
        </button>
        <button id="save-part-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- 添加/编辑费用模态框 -->
  <div id="add-edit-fee-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50 dark:bg-black/70">
    <div class="bg-white rounded-xl w-full max-w-lg p-6 dark:bg-gray-800 dark:text-white">
      <div class="flex justify-between items-center mb-4">
        <h3 id="fee-modal-title" class="text-xl font-bold">添加费用</h3>
        <button id="close-fee-modal" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label for="fee-name" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">费用名称 <span class="text-red-500">*</span></label>
          <input type="text" id="fee-name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入费用名称">
        </div>
        
        <div>
          <label for="fee-amount" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">费用金额 <span class="text-red-500">*</span></label>
          <input type="number" id="fee-amount" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入费用金额" min="0" step="0.01">
        </div>
      </div>
      
      <div class="mt-6 flex justify-end space-x-3">
        <button id="cancel-fee-btn" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
          取消
        </button>
        <button id="save-fee-btn" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- 添加/编辑系数模态框 -->
  <div id="add-edit-factor-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50 dark:bg-black/70">
    <div class="bg-white rounded-xl w-full max-w-lg p-6 dark:bg-gray-800 dark:text-white">
      <div class="flex justify-between items-center mb-4">
        <h3 id="factor-modal-title" class="text-xl font-bold">添加系数</h3>
        <button id="close-factor-modal" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label for="factor-name" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">系数名称 <span class="text-red-500">*</span></label>
          <input type="text" id="factor-name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入系数名称">
        </div>
        
        <div>
          <label for="factor-value" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">系数值 <span class="text-red-500">*</span></label>
          <input type="number" id="factor-value" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600" placeholder="请输入系数值" min="0" step="0.01">
        </div>
      </div>
      
      <div class="mt-6 flex justify-end space-x-3">

    // API客户端
    const apiClient = {
      async request(endpoint, options = {}) {
        const url = `/api${endpoint}`;
        const config = {
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          },
          ...options
        };

        try {
          const response = await fetch(url, config);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
          }

          return data;
        } catch (error) {
          console.error(`API请求失败 ${url}:`, error);
          throw error;
        }
      }
    };
    
    // 检查用户会话和角色
    async function checkUserSession() {
      try {
        // 检查是否有会话ID
        const sessionId = localStorage.getItem('sessionId');
        if (!sessionId) {
          // 没有会话ID，重定向到登录页面
          window.location.href = 'auth.html';
          return;
        }
        
        // 有会话ID，验证会话是否仍然有效
        try {
          // 首先验证会话是否有效
          const sessionResponse = await fetch('/api/session-validation', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ sessionId: sessionId })
          });
          
          if (!sessionResponse.ok) {
            // 如果API返回错误，可能是会话已过期，重定向到登录页面
            window.location.href = 'auth.html';
            return;
          }
          
          const sessionResult = await sessionResponse.json();
          if (!sessionResult.success) {
            // 如果会话验证失败，重定向到登录页面
            window.location.href = 'auth.html';
            return;
          }
          
          // 会话有效，获取用户信息（包括角色）
          const userResponse = await fetch('/api/current-user-info', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ sessionId: sessionId })
          });
          
          if (!userResponse.ok) {
            // 如果获取用户信息失败，重定向到登录页面
            window.location.href = 'auth.html';
            return;
          }
          
          const userResult = await userResponse.json();
          if (userResult.success && userResult.user) {
            // 检查用户角色
            if (!userResult.user.role || userResult.user.role !== 'admin') {
              // 如果不是管理员，重定向到登录页面
              alert('您没有权限访问此页面');
              window.location.href = 'auth.html';
              return;
            }
          } else {
            // 如果获取用户信息失败，也重定向到登录页面
            window.location.href = 'auth.html';
            return;
          }
        } catch (apiError) {
          console.error('验证会话失败:', apiError);
          // API请求失败，重定向到登录页面
          window.location.href = 'auth.html';
          return;
        }
      } catch (error) {
        console.error('检查用户会话失败:', error);
        window.location.href = 'auth.html';
      }
    }

          <td class="px-6 py-4 whitespace-nowrap">
            <input type="checkbox" class="factor-checkbox rounded" value="${factor.id}" ${state.selectedItems.factors.includes(factor.id) ? 'checked' : ''}>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">${displayName}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-300">${displayValue}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <button class="edit-factor-btn text-blue-600 hover:text-blue-900 mr-3" data-id="${factor.id}">
              <i class="fa fa-edit"></i>
            </button>
            <button class="delete-factor-btn text-red-600 hover:text-red-900" data-id="${factor.id}">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        `;
        // 添加行点击事件，用于编辑
        row.addEventListener('click', (e) => {
          // 防止点击按钮时触发行点击事件
          if (e.target.closest('.edit-factor-btn, .delete-factor-btn, .factor-checkbox')) {
            return;
          }
          // 点击行的其他部分时，编辑该项
          editFactor(factor.id);
        });
        elements.factorsTableBody.appendChild(row);
      });
      
      // 绑定编辑和删除按钮事件
      document.querySelectorAll('.edit-factor-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation(); // 防止冒泡到行点击事件
          const id = e.target.closest('.edit-factor-btn').dataset.id;
          editFactor(id);
        });
      });
      
      document.querySelectorAll('.delete-factor-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation(); // 防止冒泡到行点击事件
          const id = e.target.closest('.delete-factor-btn').dataset.id;
          deleteFactor(id);
        });
      });
      
      // 绑定选择框事件
      document.querySelectorAll('.factor-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          e.stopPropagation(); // 防止冒泡到行点击事件
          const id = e.target.value;
          if (e.target.checked) {
            if (!state.selectedItems.factors.includes(id)) {
              state.selectedItems.factors.push(id);
            }
          } else {
            state.selectedItems.factors = state.selectedItems.factors.filter(item => item !== id);
          }
        });
      });
    }

    // 搜索功能
    function initSearch() {
      // 机器搜索
      elements.machineSearch.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        if (searchTerm === '') {
          renderMachines();
          return;
        }
        
        const filtered = state.machines.filter(machine => 
          (machine.model && machine.model.toLowerCase().includes(searchTerm)) || 
          (machine.name && machine.name.toLowerCase().includes(searchTerm))
        );
        renderMachines(filtered);
      });
      
      // 部件搜索
      elements.partSearch.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        if (searchTerm === '') {
          renderParts();
          return;
        }
        
        const filtered = state.parts.filter(part => 
          (part.model && part.model.toLowerCase().includes(searchTerm)) || 
          (part.name && part.name.toLowerCase().includes(searchTerm))
        );
        renderParts(filtered);
      });
      
      // 费用搜索
      elements.feeSearch.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        if (searchTerm === '') {
          renderFees();
          return;
        }
        
        const filtered = state.fees.filter(fee => 
          (fee.name && fee.name.toLowerCase().includes(searchTerm))
        );
        renderFees(filtered);
      });
      
      // 系数搜索
      elements.factorSearch.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        if (searchTerm === '') {
          renderFactors();
          return;
        }
        
        const filtered = state.factors.filter(factor => 
          (factor.name && factor.name.toLowerCase().includes(searchTerm))
        );
        renderFactors(filtered);
      });
    }
    
    // 全选功能
    function initSelectAll() {
      // 机器表全选
      elements.selectAllMachines.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.machine-checkbox');
        checkboxes.forEach(checkbox => {
          checkbox.checked = e.target.checked;
          const id = checkbox.value;
          if (e.target.checked) {
            if (!state.selectedItems.machines.includes(id)) {
              state.selectedItems.machines.push(id);
            }
          } else {
            state.selectedItems.machines = state.selectedItems.machines.filter(item => item !== id);
          }
        });
      });
      
      // 部件表全选
      elements.selectAllParts.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.part-checkbox');
        checkboxes.forEach(checkbox => {
          checkbox.checked = e.target.checked;
          const id = checkbox.value;
          if (e.target.checked) {
            if (!state.selectedItems.parts.includes(id)) {
              state.selectedItems.parts.push(id);
            }
          } else {
            state.selectedItems.parts = state.selectedItems.parts.filter(item => item !== id);
          }
        });
      });
      
      // 费用表全选
      elements.selectAllFees.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.fee-checkbox');
        checkboxes.forEach(checkbox => {
          checkbox.checked = e.target.checked;
          const id = checkbox.value;
          if (e.target.checked) {
            if (!state.selectedItems.fees.includes(id)) {
              state.selectedItems.fees.push(id);
            }
          } else {
            state.selectedItems.fees = state.selectedItems.fees.filter(item => item !== id);
          }
        });
      });
      
      // 系数表全选
      elements.selectAllFactors.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.factor-checkbox');
        checkboxes.forEach(checkbox => {
          checkbox.checked = e.target.checked;
          const id = checkbox.value;
          if (e.target.checked) {
            if (!state.selectedItems.factors.includes(id)) {
              state.selectedItems.factors.push(id);
            }
          } else {
            state.selectedItems.factors = state.selectedItems.factors.filter(item => item !== id);
          }
        });
      });
    }
    
    // 绑定事件
    function bindEvents() {
      // 标签页切换
      initTabs();
      
      // 搜索功能
      initSearch();
      
      // 全选功能
      initSelectAll();
      
      // 机器操作按钮
      elements.addMachineBtn.addEventListener('click', addMachine);
      elements.deleteSelectedMachinesBtn.addEventListener('click', deleteSelectedMachines);
      
      // 部件操作按钮
      elements.addPartBtn.addEventListener('click', addPart);
      elements.deleteSelectedPartsBtn.addEventListener('click', deleteSelectedParts);
      
      // 费用操作按钮
      elements.addFeeBtn.addEventListener('click', addFee);
      elements.deleteSelectedFeesBtn.addEventListener('click', deleteSelectedFees);
      
      // 系数操作按钮
      elements.addFactorBtn.addEventListener('click', addFactor);
      elements.deleteSelectedFactorsBtn.addEventListener('click', deleteSelectedFactors);
      
      // 机器模态框操作
      elements.closeMachineModal.addEventListener('click', () => {
        elements.addEditMachineModal.classList.add('hidden');
      });
      elements.cancelMachineBtn.addEventListener('click', () => {
        elements.addEditMachineModal.classList.add('hidden');
      });
      elements.saveMachineBtn.addEventListener('click', saveMachine);
      
      // 部件模态框操作
      elements.closePartModal.addEventListener('click', () => {
        elements.addEditPartModal.classList.add('hidden');
      });
      elements.cancelPartBtn.addEventListener('click', () => {
        elements.addEditPartModal.classList.add('hidden');
      });
      elements.savePartBtn.addEventListener('click', savePart);
      
      // 费用模态框操作
      elements.closeFeeModal.addEventListener('click', () => {
        elements.addEditFeeModal.classList.add('hidden');
      });
      elements.cancelFeeBtn.addEventListener('click', () => {
        elements.addEditFeeModal.classList.add('hidden');
      });
      elements.saveFeeBtn.addEventListener('click', saveFee);
      
      // 系数模态框操作
      elements.closeFactorModal.addEventListener('click', () => {
        elements.addEditFactorModal.classList.add('hidden');
      });
      elements.cancelFactorBtn.addEventListener('click', () => {
        elements.addEditFactorModal.classList.add('hidden');
      });
      elements.saveFactorBtn.addEventListener('click', saveFactor);
      
      // 退出登录
      elements.logoutBtn.addEventListener('click', async () => {
        try {
          // 从localStorage中获取sessionId
          const sessionId = localStorage.getItem('sessionId');
          
          if (sessionId) {
            // 调用后端API登出（可选，清理服务器端会话）
            await apiClient.request('/users/logout', {
              method: 'POST',
              body: JSON.stringify({ sessionId: sessionId })
            }).catch(error => {
              // 如果登出API调用失败，也不影响本地登出
              console.warn('登出API调用失败:', error);
            });
          }
          
          // 清除本地存储的会话信息
          localStorage.removeItem('sessionId');
          localStorage.removeItem('username');
          
          // 重定向到登录页面
          window.location.href = 'auth.html';
        } catch (error) {
          console.error('登出过程中发生错误:', error);
          // 即使出错也清除本地会话并重定向
          localStorage.removeItem('sessionId');
          localStorage.removeItem('username');
          window.location.href = 'auth.html';
        }
      });
    }
    
    // 初始化页面
    async function init() {
      // 检查用户会话
      await checkUserSession();
      
      // 初始化主题
      initTheme();
      
      // 绑定事件
      bindEvents();
      
      // 加载数据
      await loadData();
    }
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

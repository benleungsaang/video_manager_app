<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频管理Web端 1.0</title>
  <!-- 引入本地Tailwind CSS用于快速构建UI -->
  <link rel="stylesheet" href="css/output.css">
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/MaterialIcons-Regular.otf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.ttf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff2">

  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }
      .upload-area {
        border: 2px dashed #cbd5e1;
        transition: all 0.3s ease;
      }
      .upload-area:hover {
        border-color: #3b82f6;
      }
      .modal-backdrop {
        backdrop-filter: blur(4px);
      }
      .tag-pill {
        @apply px-2 py-1 rounded-full text-xs cursor-pointer;
      }
      .tag-pill-selected {
        @apply bg-primary text-white;
      }
      .tag-pill-unselected {
        @apply bg-gray-200 text-gray-700 hover:bg-gray-300;
      }
          /* 增大菜单按钮和删除按钮尺寸 */
      .menu-btn {
        @apply w-8 h-8 flex items-center justify-center rounded-full;
      }
      .menu-item {
        @apply px-3 py-2 text-sm flex items-center;
      }
    }
  </style>

  <!-- 注册Service Worker 用于后续视频播放，下载/合并-->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker注册成功: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker注册失败: ', err);
          });
      });
    }
  </script>
</head>

<body class="bg-gray-50 min-h-screen dark:bg-gray-900 dark:text-white">
  <!-- 深色模式暖色调覆盖层 -->
  <div id="warm-overlay" class="fixed inset-0 pointer-events-none z-51 hidden dark:block"
    style="background-color: rgba(255, 153, 0, 0.08); mix-blend-mode: multiply;"></div>
  <!-- 顶部导航栏 -->
  <header class="bg-white shadow-md dark:bg-gray-800 dark:text-white">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-primary dark:text-blue-400">视频管理系统 <span id="video-count"
          class="text-sm text-gray-500 ml-2 dark:text-gray-400">(加载中...)</span></h1>

      <!-- 搜索框 -->
      <div class="flex-1 max-w-md mx-8">
        <div class="relative">
          <input type="text" id="search-input" placeholder="搜索 【 整个数据库 】 视频 - 标题或标签..."
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600">
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-300"></i>
        </div>
      </div>

      <!-- 深色模式切换按钮 -->
      <button id="theme-toggle" class="mr-4 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition"
        aria-label="切换深色模式">
        <i class="fa fa-moon-o text-gray-700 dark:text-yellow-300"></i>
      </button>
      
      <!-- 登出按钮 -->
      <button id="logout-btn" class="mr-4 px-3 py-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition"
        aria-label="登出">
        <i class="fa fa-sign-out text-gray-700 dark:text-gray-300"></i>
      </button>

      <!-- 上传视频按钮 -->
      <button id="upload-btn"
        class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-secondary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
        <i class="fa fa-cloud-upload mr-1"></i> 上传视频
      </button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">

    <!-- 本地视频筛选 -->
    <div class="mb-6">
      <div class="relative">
        <input type="text" id="filter-input" placeholder="在 【 当前搜索结果 】 中筛选 - 标题或标签..."
          class="w-full pl-10 pr-4 py-2 my-5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600">
      </div>

      <!-- 视频列表区域 -->
      <div id="video-grid" class="video-grid">
        <!-- 视频卡片会通过JavaScript动态生成 -->
        <div class="text-center text-gray-500 py-12">
          <i class="fa fa-film text-4xl mb-4"></i>
          <p>暂无视频，请上传视频文件</p>
        </div>
      </div>
  </main>

  <!---------------------- 视频上传浮框 --------------------------->
  <div id="upload-modal"
    class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50 dark:bg-black/70">
    <div
      class="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col dark:bg-gray-800 dark:text-white">
      <!-- 浮框头部 -->
      <div class="flex justify-between items-center p-4 border-b dark:border-gray-700 dark:bg-gray-700">
        <h3 class="text-xl font-bold dark:text-white">上传视频</h3>
        <button id="close-upload-modal"
          class="text-gray-500 hover:text-gray-700 p-2 dark:text-gray-300 dark:hover:text-white">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>

      <!-- 浮框内容 -->
      <div class="flex-1 overflow-y-auto p-6 dark:bg-gray-800 dark:text-white">
        <!-- 视频预览区域 -->
        <div class="mb-6">
          <div class="bg-gray-100 rounded-lg overflow-hidden dark:bg-gray-700">
            <video id="video-preview" class="w-full aspect-video object-contain" controls crossorigin="anonymous"
              playsinline webkit-playsinline preload="metadata"></video>
          </div>
          <div class="mt-2 text-sm text-gray-500 flex justify-between dark:text-gray-400">

            <span id="video-duration">时长: --:--</span>

            <span id="video-size">大小: --</span>

          </div>

          <!-- 视频边编辑边上传，先上传的按钮 -->

          <button id="upload-first-btn"
            class="hidden bg-secondary text-white px-6 py-2 rounded-lg hover:bg-secondary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">

            先上传视频

          </button>
          <!-- 视频边编辑边上传，先上传的按钮 -->

            class="hidden bg-primary text-white px-6 py-2 rounded-lg hover:bg-secondary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">

          <!-- 预上传 - 进度条 -->

            </div>

          <!-- 标签选择 -->

            <label class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">标签</label>
            <div id="tag-selection"

              <p class="text-gray-500 text-sm w-full text-center dark:text-gray-400">待添加标签...</p>
            </div>
            <div class="flex items-center">

                placeholder="添加新标签">
              <button id="add-tag-btn-modal"
                class="bg-primary text-white px-4 py-2 rounded-r-lg hover:bg-primary/90 dark:bg-blue-600 dark:hover:bg-blue-700">
                添加
              </button>
            </div>
          </div>

          <!-- 备注信息 -->
          <div>
            <label for="video-remark" class="block text-sm font-medium text-gray-700 mb-1 dark:text-gray-300">备注</label>
            <textarea id="video-remark" rows="3"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white text-gray-900 dark:bg-gray-700 dark:text-white dark:border-gray-600"
              placeholder="请输入备注信息（可选）"></textarea>
          </div>
        </div>
      </div>

      <!-- 浮框底部 -->
      <div class="p-4 border-t flex justify-end gap-3 dark:border-gray-700 dark:bg-gray-800">
        <button id="cancel-upload-btn"
          class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
          取消
        </button>
        <button id="save-video-btn"
          class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-primary/90 transition dark:bg-blue-600 dark:hover:bg-blue-700">
          保存视频
        </button>
      </div>
      <!-- 浮框底部 - 进度条 -->
      <div class="px-6 pb-2 hidden" id="upload-progress-container-bottom">
        <div class="text-sm text-gray-600 mb-1 dark:text-gray-300">上传进度</div>
        <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
          <div id="upload-progress-bar-bottom" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>


  <!-- 确认取消对话框 -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-xl w-full max-w-md p-6">
      <h3 class="text-xl font-bold mb-4">确认取消</h3>
      <p class="text-gray-600 mb-6">确定要取消上传吗？已上传的部分将被丢弃。</p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel-btn"
          class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
          继续编辑
        </button>
        <button id="confirm-ok-btn" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">
          确认取消
        </button>
      </div>
    </div>
  </div>
  <!---------------------- 视频上传浮框 --------------------------->

  <!-- 操作成功提示框 toast -->
  <div id="toast"
    class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
    操作成功
  </div>

  <script>
    // 检查登录状态
    async function checkAuth() {
      const sessionId = localStorage.getItem('sessionId');
      if (!sessionId) {
        // 未登录，重定向到登录页面
        alert('请先登录系统');
        window.location.href = 'auth.html';
        return false;
      }
      
      // 验证会话是否仍然有效
      try {
        const response = await fetch('/api/session-validation', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ sessionId: sessionId })
        });
        
        if (!response.ok) {
          // 如果API返回错误，会话可能已过期，重定向到登录页面
          window.location.href = 'auth.html';
          return false;
        }
        
        const result = await response.json();
        if (!result.success) {
          window.location.href = 'auth.html';
          return false;
        }
      } catch (error) {
        console.error('验证会话失败:', error);
        window.location.href = 'auth.html';
        return false;
      }
      
      return true;
    }
    
    // 在页面加载时检查认证
    if (!checkAuth()) {
      // 如果未通过认证检查，不继续加载页面功能
      throw new Error('未通过认证检查');
    }
    
    // HTTP API通信模块
    const apiClient = {
      // 通用请求函数
      async request(endpoint, options = {}) {
        const url = `/api${endpoint}`;
        const config = {
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          },
          ...options
        };

        try {
          const response = await fetch(url, config);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
          }

          return data;
        } catch (error) {
          console.error(`API请求失败 ${url}:`, error);
          throw error;
        }
      },

      // 搜索视频的防抖实现
      _searchDebounceTimer: null,
      _currentSearchId: null,

      searchVideos: async function (searchTerm) {
        // 防抖功能：延迟执行搜索，取消之前的请求
        if (this._searchDebounceTimer) {
          clearTimeout(this._searchDebounceTimer);
        }

        // 创建唯一的搜索请求ID，用于取消旧请求
        const searchRequestId = Date.now().toString() + Math.random().toString(36).substr(2, 9);
        this._currentSearchId = searchRequestId;

        return new Promise((resolve, reject) => {
          this._searchDebounceTimer = setTimeout(async () => {
            try {
              // 检查当前请求是否仍为最新的请求
              if (this._currentSearchId !== searchRequestId) {
                // 如果不是最新的请求，则取消此请求
                reject(new Error('Search request cancelled due to new search'));
                return;
              }

              const result = await this.request(`/search?q=${encodeURIComponent(searchTerm)}`);

              // 再次检查，确保响应仍是针对最新的搜索请求
              if (this._currentSearchId === searchRequestId) {
                resolve(result.data);
              } else {
                reject(new Error('Search request cancelled due to new search'));
              }
            } catch (error) {
              // 只有当错误不是由于请求取消导致的，才真正拒绝
              if (error.message !== 'Search request cancelled due to new search') {
                reject(error);
              } else {
                // 请求被取消，返回空结果
                resolve([]);
              }
            }
          }, 300); // 300ms 防抖延迟
        });
      },

      // 标签相关接口
      getTags: async function () {
        const response = await this.request('/tags');
        return response.data;
      },

      addTag: async function (tagName) {
        const response = await this.request('/tags', {
          method: 'POST',
          body: JSON.stringify({ name: tagName })
        });
        return response.data;
      },

      deleteTag: async function (tagId) {
        const response = await this.request(`/tags/${tagId}`, {
          method: 'DELETE'
        });
        return response;
      },

      // 视频相关接口
      getVideos: async function () {
        const response = await this.request('/videos');
        return response.data;
      },

      getRecentVideos: async function (limit) {
        const response = await this.request(`/videos/recent?limit=${limit || 5}`);
        return response.data;
      },

      getVideoUrl: async function (videoId) {
        const response = await this.request(`/videos/${videoId}/url`);
        return response.data.videoUrl;
      },

      getVideoSize: async function (videoId) {
        const response = await this.request(`/videos/${videoId}/size`);
        return response.data.videoSize;
      },

      deleteVideo: async function (videoId) {
        const response = await this.request(`/videos/${videoId}`, {
          method: 'DELETE'
        });
        return response;
      },

      getThumbnail: async function (videoId) {
        // 返回缩略图的base64数据
        const response = await this.request(`/thumbnails/${videoId}`);
        return response.data.base64;
      },

      updateVideo: async function (video) {
        const response = await this.request(`/videos/${video.id}`, {
          method: 'PUT',
          body: JSON.stringify(video)
        });
        return response.data;
      }
    };
    // 状态管理
    const state = {
      videos: [],
      originalVideos: null, // 用于存储原始视频列表，搜索时使用
      tags: [],
      selectedTagIds: [],
      currentEditingVideo: null, // 当前正在编辑的视频
      selectedTagIdsForUpload: [], // 上传视频时选择的标签ID
      pendingUploads: new Map(), // 存储已上传但未合并的文件ID
      currentUploadFile: null, // 当前要上传的 文件
      currentFileId: null, // 当前要上传 文件的ID
      cancelUpload: false, // 是否正在执行缓存
      theme: localStorage.getItem('theme') || 'light', // 主题状态
    }

    // DOM元素引用
    const elements = {
      searchInput: document.getElementById('search-input'), // 数据库搜索输入框
      filterInput: document.getElementById('filter-input'), // 本地视频筛选输入框
      uploadBtn: document.getElementById('upload-btn'), // 上传按钮
      videoGrid: document.getElementById('video-grid'), // 视频网格容器

      // 上传浮框相关元素
      uploadModal: document.getElementById('upload-modal'),
      uploadFirstBtn: document.getElementById('upload-first-btn'),
      downloadBtn: document.getElementById('download-btn'),
      closeUploadModal: document.getElementById('close-upload-modal'),
      videoPreview: document.getElementById('video-preview'),
      videoTitle: document.getElementById('video-title'),
      videoDuration: document.getElementById('video-duration'),
      videoSize: document.getElementById('video-size'),
      videoRemark: document.getElementById('video-remark'),
      tagSelection: document.getElementById('tag-selection'),
      newTagInputModal: document.getElementById('new-tag-input-modal'),
      addTagBtnModal: document.getElementById('add-tag-btn-modal'),
      saveVideoBtn: document.getElementById('save-video-btn'),
      cancelUploadBtn: document.getElementById('cancel-upload-btn'),
      progressContainerTop: document.getElementById('upload-progress-container-top'),
      progressContainerBottom: document.getElementById('upload-progress-container-bottom'),
      progressBarTop: document.getElementById('upload-progress-bar-top'),
      progressBarBottom: document.getElementById('upload-progress-bar-bottom'),
      // videoCompressBox: document.getElementById('video-compress-box'),
      // 确认对话框
      confirmModal: document.getElementById('confirm-modal'),
      confirmCancelBtn: document.getElementById('confirm-cancel-btn'),
      confirmOkBtn: document.getElementById('confirm-ok-btn'),
      // 深色模式切换按钮
      themeToggle: document.getElementById('theme-toggle'),
      // 隐藏的文件输入
      videoCount: document.getElementById('video-count'), // 视频计数显示元素
      fileInput: document.createElement('input')
    }

    // 初始化文件输入元素(上传视频模块 相关设置)
    elements.fileInput.type = 'file';
    elements.fileInput.accept = 'video/*';
    elements.fileInput.classList.add('hidden');
    document.body.appendChild(elements.fileInput);


    // 初始化函数





    async function init() {


      console.log('初始化函数 init() 被调用');


      try {


        // 初始化主题


        initTheme();





        // 检测是否为Safari浏览器


        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);





        if (isSafari) {


          // 对于Safari，增加一个小延迟以确保WebSocket连接稳定


          console.log('检测到Safari浏览器，等待连接稳定...');


          await new Promise(resolve => setTimeout(resolve, 500)); // 500ms延迟


        }





        // 加载视频和标签数据


        await loadTags();


        await loadVideos(5); // 只加载最近的5个视频以提高初始化效率





        // 绑定事件监听器


        bindEvents();


      } catch (error) {


        console.log('初始化失败:', error);


      }


    }

    // 加载视频列表
    async function loadVideos(limit = null) {
      try {
        if (limit) {
          console.log(`加载最近 ${limit} 个视频...`);
          const videos = await apiClient.getRecentVideos(limit);
          state.videos = videos;
        } else {
          console.log('加载视频列表...');
          const videos = await apiClient.getVideos();
          state.videos = videos;
        }
        renderVideoGrid();
      } catch (error) {
        console.error('加载视频失败:', error);
      }
    }
    // 加载标签列表
    async function loadTags() {
      try {
        console.log('加载标签列表...');
        const tags = await apiClient.getTags();
        state.tags = tags;
        // renderTagFilters();
        // renderTagList();
      } catch (error) {
        console.error('加载标签失败:', error);
      }
    }

    // 优化：避免重复请求，对相同路径的缩略图进行缓存，减少重复请求
    const thumbnailCache = new Map();

    // 使用 localStorage 持久化缓存的缩略图
    function saveThumbnailToStorage(videoId, base64Data) {
      try {
        const cache = JSON.parse(localStorage.getItem('thumbnailStorage') || '{}');
        cache[videoId] = {
          data: base64Data,
          timestamp: Date.now(),
          expiry: Date.now() + (24 * 60 * 60 * 1000) // 24小时后过期
        };
        localStorage.setItem('thumbnailStorage', JSON.stringify(cache));
      } catch (e) {
        console.warn('无法保存缩略图到本地存储:', e);
      }
    }

    function getThumbnailFromStorage(videoId) {
      try {
        const cache = JSON.parse(localStorage.getItem('thumbnailStorage') || '{}');
        const item = cache[videoId];

      // 检查内存缓存
      if (thumbnailCache.has(video.id)) {
        return thumbnailCache.get(video.id);
      }

      // 检查本地存储缓存
      const cachedBase64 = getThumbnailFromStorage(video.id);
      if (cachedBase64) {
        const imgHtml = `<img src="data:image/jpeg;base64,${cachedBase64}"
                    alt="${video.title}"
                    class="w-full h-full object-cover loading-lazy">`;
        thumbnailCache.set(video.id, imgHtml);
        return imgHtml;
      }

      try {
        // 获取Base64格式的缩略图
        const base64Data = await apiClient.getThumbnail(video.id);

        if (!base64Data) {
          throw new Error('缩略图数据格式错误，无法获取base64数据');

        const imgHtml = `<img src="data:image/jpeg;base64,${base64Data}"
                    alt="${video.title}"
                    class="w-full h-full object-cover loading-lazy">`;
        thumbnailCache.set(video.id, imgHtml);
        saveThumbnailToStorage(video.id, base64Data);

              const videoCard = entry.target;
              const videoId = videoCard.dataset.videoId;
              if (videoId) {
                // 可以在这里对即将进入视图的视频进行预加载
                // 但当前我们使用的是现有的缩略图函数

    // 缓存视频，预上传
    async function uploadBinary(fileId, videoFile) {
      try {
        // 根据浏览器类型和文件大小计算最优分块大小
        function calcOptimalChunkSize(totalSize, userAgent) {
          const isSafari = /safari/.test(userAgent.toLowerCase()) && !/chrome|edge|firefox/.test(userAgent.toLowerCase());
          const isIPhone = /iphone|ipod/.test(userAgent.toLowerCase());
          const isIPad = /ipad/.test(userAgent.toLowerCase());
          const isIOS = isIPhone || isIPad;
          const isIPhoneSafari = isIPhone && isSafari;
          const isIOSBrowser = isIOS && isSafari;
          
          let chunkSize;
          
          if (isIOSBrowser) {
            // iOS Safari 规则
            if (totalSize <= 25 * 1024 * 1024) { // ≤25MB
              chunkSize = 256 * 1024; // 256KB
            } else if (totalSize <= 50 * 1024 * 1024) { // 25MB~50MB
              chunkSize = 512 * 1024; // 512KB
            } else { // ＞50MB
              chunkSize = 1 * 1024 * 1024; // 1MB
            }
          } else if (isSafari) {
            // 桌面Safari 规则
            if (totalSize <= 50 * 1024 * 1024) { // ≤50MB
              chunkSize = 512 * 1024; // 512KB
            } else if (totalSize <= 100 * 1024 * 1024) { // 50MB~100MB
              chunkSize = 1 * 1024 * 1024; // 1MB
            } else { // ＞100MB
              chunkSize = 2 * 1024 * 1024; // 2MB
            }
          } else {
            // 其他浏览器（Chrome/Firefox/Edge等）规则
            if (totalSize <= 100 * 1024 * 1024) { // ≤100MB
              chunkSize = 1 * 1024 * 1024; // 1MB
            } else if (totalSize <= 500 * 1024 * 1024) { // 100MB~500MB
              chunkSize = 2 * 1024 * 1024; // 2MB
            } else { // ＞500MB
              chunkSize = 5 * 1024 * 1024; // 5MB
            }
          }
          
          return chunkSize;
        }
        
        const chunkSize = calcOptimalChunkSize(videoFile.size, navigator.userAgent);
        const totalChunks = Math.ceil(videoFile.size / chunkSize);

        // 1. 初始化上传
        const initResponse = await fetch('/api/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            action: 'initUpload',
            fileId: fileId,
            fileName: videoFile.name,
            totalSize: videoFile.size,
            totalChunks: totalChunks,
            userAgent: navigator.userAgent
          })
        });

        const initResult = await initResponse.json();
        if (!initResult.success) {
          throw new Error(initResult.error || '初始化上传失败');
        }

        const effectiveChunkSize = initResult.chunkSize || chunkSize; // 使用后端返回的块大小或计算的大小
        const effectiveTotalChunks = Math.ceil(videoFile.size / effectiveChunkSize);

        // 2. 分块上传
        for (let i = 0; i < effectiveTotalChunks; i++) {
          const start = i * effectiveChunkSize;
          const end = Math.min(start + effectiveChunkSize, videoFile.size);
          const chunk = videoFile.slice(start, end);

          // 创建FormData来发送二进制数据
          const formData = new FormData();
          formData.append('chunk', chunk, `chunk_${i}`);
          
          // 添加其他元数据
          formData.append('action', 'uploadChunk');
          formData.append('fileId', fileId);
          formData.append('chunkIndex', i.toString());

          const chunkResponse = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });

          const chunkResult = await chunkResponse.json();
          if (!chunkResult.success) {
            throw new Error(chunkResult.error || `上传分块 ${i+1} 失败`);
          }

          // 更新进度（对于预上传，可以更新顶部进度条）
          const progress = Math.floor(((i + 1) / effectiveTotalChunks) * 100);
          elements.progressBarTop.style.width = `${progress}%`;
        }
      } catch (error) {
        console.error('预上传失败:', error);
        
        // 如果上传失败，尝试取消上传以清理临时文件
        try {
          await fetch('/api/upload', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              action: 'cancelUpload',
              fileId: fileId
            })
          });
        } catch (cleanupError) {
          console.error('清理临时文件失败:', cleanupError);
        }
        
        throw error; // 重新抛出错误，让调用方处理
      }
    }

    function handleVideoError(e) {

      if (!elements.videoPreview || !elements.videoPreview.src || elements.videoPreview.src === '') {

      // 避免无限错误循环，只在特定错误类型时尝试重新加载
      if (e.target.error.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
        // 如果是源不支持错误，不应该尝试重新加载
        console.warn('视频源不支持，无法播放');
        return;

      // 因此只执行一次错误处理，不尝试自动恢复
    }

        } else if (state.currentEditingVideo) {
          // 编辑模式：放弃编辑，直接关闭
          elements.uploadModal.classList.add('hidden');
          state.currentEditingVideo = null;
          elements.confirmModal.classList.add('hidden');
        } else {
          // 非上传非编辑模式，直接关闭
          elements.uploadModal.classList.add('hidden');
          elements.confirmModal.classList.add('hidden');
        }
      });

      // 保存视频按钮
      elements.saveVideoBtn.addEventListener('click', saveVideo);

      // 模态框外部点击关闭
      elements.uploadModal.addEventListener('click', (e) => {
        if (e.target === elements.uploadModal) {
          // 如果是上传模式，需要确认
          if (state.currentUploadFile) {
            // 上传模式下的确认对话框
            document.querySelector('#confirm-modal h3').textContent = '确认取消';
            document.querySelector('#confirm-modal p').textContent = '确定要取消上传吗？已上传的部分将被丢弃。';
            document.querySelector('#confirm-ok-btn').textContent = '确认取消';
            elements.confirmModal.classList.remove('hidden');
          } else if (state.currentEditingVideo) {
            // 如果是编辑模式，检查是否有修改
            const hasChanges =
              state.currentEditingVideo.title !== elements.videoTitle.value.trim() ||
              (state.currentEditingVideo.remark || '') !== elements.videoRemark.value.trim() ||
              JSON.stringify(state.currentEditingVideo.tagIds) !== JSON.stringify(state.selectedTagIdsForUpload);

            if (hasChanges) {
              // 编辑模式下的确认对话框
              document.querySelector('#confirm-modal h3').textContent = '确认放弃编辑';
              document.querySelector('#confirm-modal p').textContent = '是否放弃当前编辑内容？';
              document.querySelector('#confirm-ok-btn').textContent = '放弃编辑';
              elements.confirmModal.classList.remove('hidden');
            } else {
              elements.uploadModal.classList.add('hidden');
              state.currentEditingVideo = null;
            }
          } else {
            // 非上传非编辑模式，直接关闭
            elements.uploadModal.classList.add('hidden');
          }
        }
      });

      elements.confirmModal.addEventListener('click', (e) => {
        if (e.target === elements.confirmModal) {
          elements.confirmModal.classList.add('hidden');
        }
      });

      // 浮框中添加标签按钮
      elements.addTagBtnModal.addEventListener('click', async () => {
        const tagName = elements.newTagInputModal.value.trim();
        if (tagName) {
          try {
            // 检查标签是否已存在
            const existingTag = state.tags.find(t => t.name.toLowerCase() === tagName.toLowerCase());
            if (existingTag) {
              // 已存在则直接选中
              if (!state.selectedTagIdsForUpload.includes(existingTag.id)) {
                state.selectedTagIdsForUpload.push(existingTag.id);
              }
              elements.newTagInputModal.value = '';
              renderTagSelection();
              return;
            }



            // 对不存在的标签进行添加
            const newTag = await apiClient.addTag(tagName);
            // 更新本地标签列表
            state.tags.push(newTag);
            state.selectedTagIdsForUpload.push(newTag.id);
            // 清空输入框
            elements.newTagInputModal.value = '';
            // 重新渲染标签选择区域
            renderTagSelection();
          } catch (error) {
            console.error('添加标签失败:', error);
            alert(`添加标签失败: ${error.message || '未知错误'}`);
          }
        }
      });

      // 浮框中按Enter键添加标签
      elements.newTagInputModal.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          elements.addTagBtnModal.click();
        }
      });

      // 为每个视频卡片的删除按钮事件做绑定
      document.querySelectorAll('.delete-menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const videoId = btn.dataset.videoId;
          document.querySelectorAll('.delete-menu').forEach(menu => {
            menu.classList.add('hidden');
          });
          btn.nextElementSibling.classList.toggle('hidden');
        });
      });

      // 点击页面其他区域隐藏所有删除菜单
      document.addEventListener('click', () => {
        document.querySelectorAll('.delete-menu').forEach(menu => {
          menu.classList.add('hidden');
        });
      })
    }

    // 工具函数：格式化时长
    function formatDuration(seconds) {
      if (!seconds) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 工具函数：格式化文件大小
    function formatFileSize(bytes) {
      if (bytes <= 0) return "0 B";
      const suffixes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(2)} ${suffixes[i]}`;
    }

    // 工具函数：格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString();
    }

    // 工具函数：更新视频计数显示
    function updateVideoCount(count, isFiltered = false) {
      if (elements.videoCount) {
        if (isFiltered) {
          elements.videoCount.textContent = `(显示 ${count} 个视频)`;
          elements.videoCount.className = 'text-sm text-green-500 ml-2'; // 绿色表示筛选结果
        } else {
          elements.videoCount.textContent = `(共 ${count} 个视频)`;
          elements.videoCount.className = 'text-sm text-gray-500 ml-2'; // 灰色表示总数
        }
      }
    }

    // 工具函数：显示操作成功提示框
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    // 登出功能
    async function logout() {
      try {
        // 从localStorage中获取sessionId
        const sessionId = localStorage.getItem('sessionId');
        
        if (sessionId) {
          // 调用后端API登出（可选，清理服务器端会话）
          await apiClient.request('/users/logout', {
            method: 'POST',
            body: JSON.stringify({ sessionId: sessionId })
          }).catch(error => {
            // 如果登出API调用失败，也不影响本地登出
            console.warn('登出API调用失败:', error);
          });
        }
        
        // 清除本地存储的会话信息
        localStorage.removeItem('sessionId');
        localStorage.removeItem('username');
        
        // 重定向到登录页面
        window.location.href = 'auth.html';
      } catch (error) {
        console.error('登出过程中发生错误:', error);
        // 即使出错也清除本地会话并重定向
        localStorage.removeItem('sessionId');
        localStorage.removeItem('username');
        window.location.href = 'auth.html';
      }
    }
    
    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', function() {
      // 在认证检查通过后再初始化
      if (checkAuth) {
        checkAuth().then(isAuthenticated => {
          if (isAuthenticated) {
            init();
          }
        });
      } else {
        init();
      }
    });
    
    // 绑定登出按钮事件
    document.getElementById('logout-btn')?.addEventListener('click', logout);

    // 视频下载管理器 - 支持断点续传和分块下载
    class VideoDownloader {
      constructor(videoId, baseUrl, originalFileName = null) {
        this.videoId = videoId;
        this.baseUrl = baseUrl;
        this.videoUrl = `${baseUrl}/videoStream/${videoId}`;
        this.originalFileName = originalFileName; // 保存原始文件名
        this.chunks = new Map(); // 存储已下载的分块
        this.totalSize = 0;
        this.worker = null;
        this.isDownloading = false;
      }

      // 初始化下载 - 获取文件总大小
      async init() {
        try {
          // apiClient.getVideoSize返回的是response.data.videoSize，已经是数字格式
          this.totalSize = await apiClient.getVideoSize(this.videoId);
          await this.loadCache(); // 加载缓存的分块
          return this.totalSize;
        } catch (error) {
          console.error('初始化下载失败:', error);
          throw error;
        }
      }

      // 从Cache API加载缓存的分块
      async loadCache() {
        if (!('caches' in window)) return;

        const cache = await caches.open(`video_${this.videoId}`);
        const keys = await cache.keys();

        for (const key of keys) {
          if (key.url.startsWith(this.videoUrl) && key.headers.get('Range')) {
            const range = key.headers.get('Range').match(/bytes=(\d+)-(\d*)/);
            if (range) {
              const start = parseInt(range[1]);
              const end = range[2] ? parseInt(range[2]) : this.totalSize - 1;
              const response = await cache.match(key);
              const blob = await response.blob();
              this.chunks.set(start, { end, blob });
            }
          }
        }
      }

      // 计算分块大小（根据设备类型）
      getChunkSize() {
        const userAgent = navigator.userAgent.toLowerCase();
        const isIPhoneSafari = /iphone|ipod/.test(userAgent) &&
          /safari/.test(userAgent) &&
          !/chrome|edge|firefox/.test(userAgent);

        if (isIPhoneSafari) {
          if (this.totalSize <= 25 * 1024 * 1024) return 256 * 1024; // 256KB
          if (this.totalSize <= 50 * 1024 * 1024) return 512 * 1024; // 512KB
          if (this.totalSize <= 100 * 1024 * 1024) return 1 * 1024 * 1024; // 1MB
          return 2 * 1024 * 1024; // 2MB
        } else {
          return this.totalSize <= 100 * 1024 * 1024 ? 5 * 1024 * 1024 : 10 * 1024 * 1024;
        }
      }

      // 开始下载
      startDownload(onProgress) {
        if (this.isDownloading) return;
        this.isDownloading = true;

        // 创建Web Worker处理分块下载
        this.worker = new Worker('download-worker.js');

        // 向Worker发送初始化信息
        this.worker.postMessage({
          type: 'init',
          videoUrl: this.videoUrl,
          totalSize: this.totalSize,
          chunkSize: this.getChunkSize(),
          cachedChunks: Array.from(this.chunks.entries()).map(([start, data]) => ({
            start,
            end: data.end
          })),
          isAndroidTablet: /android/.test(navigator.userAgent.toLowerCase()) &&
            screen.width >= 768
        });

        // 监听Worker消息
        this.worker.onmessage = (e) => {
          switch (e.data.type) {
            case 'progress':
              onProgress(e.data.progress);
              break;
            case 'chunk':
              this.saveChunk(e.data.start, e.data.end, e.data.blob);
              break;
            case 'complete':
              this.completeDownload();
              break;
            case 'error':
              console.error('下载错误:', e.data.error);
              this.isDownloading = false;
              break;
          }
        };
      }

      // 保存分块到缓存
      async saveChunk(start, end, blob) {
        this.chunks.set(start, { end, blob });

        // 保存到Cache API
        if ('caches' in window) {
          const cache = await caches.open(`video_${this.videoId}`);
          const request = new Request(this.videoUrl, {
            headers: { 'Range': `bytes=${start}-${end}` }
          });
          const response = new Response(blob, {
            status: 206,
            headers: {
              'Content-Range': `bytes ${start}-${end}/${this.totalSize}`,
              'Content-Type': 'application/octet-stream'
            }
          });
          await cache.put(request, response);
        }
      }

      // 完成下载并合并文件
      async completeDownload() {
        this.isDownloading = false;
        this.worker.terminate();

        // 按顺序合并分块
        const sortedChunks = Array.from(this.chunks.entries())
          .sort((a, b) => a[0] - b[0])
          .map(([_, data]) => data.blob);

        // 根据原始文件名确定MIME类型和扩展名
        let mimeType = 'video/mp4'; // 默认MIME类型
        let fileExtension = '.mp4'; // 默认扩展名
        if (this.originalFileName) {
          const ext = this.originalFileName.toLowerCase().split('.').pop();
          if (ext === 'mov') {
            mimeType = 'video/quicktime';
            fileExtension = '.mov';
          } else if (ext === 'mp4') {
            mimeType = 'video/mp4';
            fileExtension = '.mp4';
          } else if (ext === 'webm') {
            mimeType = 'video/webm';
            fileExtension = '.webm';
          } else if (ext === 'ogg') {
            mimeType = 'video/ogg';
            fileExtension = '.ogg';
          } else if (ext === 'avi') {
            mimeType = 'video/x-msvideo';
            fileExtension = '.avi';
          } else if (ext === 'wmv') {
            mimeType = 'video/x-ms-wmv';
            fileExtension = '.wmv';
          } else if (ext === 'flv') {
            mimeType = 'video/x-flv';
            fileExtension = '.flv';
          } else {
            fileExtension = '.' + ext; // 使用原始扩展名
          }
        }

        const videoBlob = new Blob(sortedChunks, { type: mimeType });
        const url = URL.createObjectURL(videoBlob);

        // 触发下载
        elements.downloadBtn.innerHTML = `<i class="fa fa-download mr-1"></i>下载完成`;
        const a = document.createElement('a');
        a.href = url;
        a.download = this.originalFileName || `video_${this.videoId}${fileExtension}`;
        document.body.appendChild(a);
        a.click();
        // 立即移除元素和清理URL
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.cleanupCache(); // 清理缓存
      }

      // 清理缓存
      async cleanupCache() {
        if ('caches' in window) {
          await caches.delete(`video_${this.videoId}`);
        }
      }

      // 取消下载
      cancel() {
        if (this.worker) {
          this.worker.terminate();
        }
        this.isDownloading = false;
      }
    }
  </script>

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频管理Web端 1.0</title>
  <!-- 引入Tailwind CSS用于快速构建UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome图标库 -->
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/MaterialIcons-Regular.otf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.ttf">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff">
  <link rel="stylesheet" type="text/x-font-otf" href="fonts/fontawesome-webfont.woff2">

  <!-- 配置Tailwind自定义颜色 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
        },
      }
    }

  </script>

  <!-- 配置Tailwind深色模式 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#64748b',
          },
        },
      }
    }
  </script>

  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }
      .upload-area {
        border: 2px dashed #cbd5e1;
        transition: all 0.3s ease;
      }
      .upload-area:hover {
        border-color: #3b82f6;
      }
      .modal-backdrop {
        backdrop-filter: blur(4px);
      }
      .tag-pill {
        @apply px-2 py-1 rounded-full text-xs cursor-pointer;
      }
      .tag-pill-selected {
        @apply bg-primary text-white;
      }
      .tag-pill-unselected {
        @apply bg-gray-200 text-gray-700 hover:bg-gray-300;
      }
          /* 增大菜单按钮和删除按钮尺寸 */
      .menu-btn {
        @apply w-8 h-8 flex items-center justify-center rounded-full;
      }
      .menu-item {
        @apply px-3 py-2 text-sm flex items-center;
      }
    }
  </style>

  <!-- 注册Service Worker 用于后续视频播放，下载/合并-->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker注册成功: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker注册失败: ', err);
          });
      });
    }
  </script>
</head>

  <!-- 确认取消对话框 -->
  <div id="confirm-modal" class="fixed inset-0 bg-black/50 modal-backdrop flex items-center justify-center hidden z-50">

  <!-- 操作成功提示框 toast -->

    class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
    操作成功
  </div>

  <script>

    // 与Flutter原生通信的通道

    const flutterChannel = {
      // 存储WebSocket实例
      _ws: null,

      // 存储请求的回调函数，用requestId映射
      _callbacks: new Map(),



      // 获取或生成客户端唯一ID
      _getClientId() {

        let clientId = localStorage.getItem('clientId');

        if (!clientId) {

          // 生成一个UUID作为客户端ID

          clientId = 'web_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

          localStorage.setItem('clientId', clientId);

        }

        return clientId;

      },

      // 请求队列和批处理相关
      _requestQueue: [],
      _batchTimeout: null,
      _maxBatchSize: 10, // 最大批处理请求数

      // 批量发送请求
      _processRequestBatch() {
        if (this._requestQueue.length === 0) return;

        // 取出一部分请求进行批处理
        const batch = this._requestQueue.splice(0, this._maxBatchSize);

        // 创建批量请求
        const batchRequest = {
          id: this._generateRequestId(),
          action: 'batch',
          params: { requests: batch.map(req => ({
            id: req.id,
            action: req.action,
            params: req.params
          }))}
        };

        // 为每个请求设置回调
        batch.forEach(request => {
          this._callbacks.set(request.id, request.callback);
        });

        console.log('发送批量请求:', batchRequest);
        this._ws.send(JSON.stringify(batchRequest));

        // 如果还有请求在队列中，继续处理
        if (this._requestQueue.length > 0) {
          clearTimeout(this._batchTimeout);
          this._batchTimeout = setTimeout(() => this._processRequestBatch(), 50); // 50ms延迟
        } else {
          this._batchTimeout = null;
        }
      },

      // 添加请求到队列（暂时禁用批量请求，以兼容后端）
      _enqueueRequest(action, params = {}) {
        // 直接发送单个请求，避免后端不支持批量请求的问题
        return this._sendRequest(action, params);
      },



      // 初始化WebSocket连接
      _initWebSocket() {

        if (this._ws && this._ws.readyState === WebSocket.OPEN) {

          return Promise.resolve();

        }



        return new Promise((resolve, reject) => {
          const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const clientId = this._getClientId();
          const wsUrl = `${wsProtocol}//${window.location.host}/ws?clientId=${clientId}`;
          this._ws = new WebSocket(wsUrl);
          this._ws.onopen = () => {

            console.log('WebSocket连接已建立，客户端ID:', clientId);

            // 监听服务端消息

            this._ws.onmessage = (event) => this._handleMessage(event);

            resolve();

          };
          this._ws.onerror = (error) => {

            console.error('WebSocket连接错误:', error);

            reject(error);

          };
          this._ws.onclose = () => {

            console.log('WebSocket连接已关闭，尝试重连...');

            this._ws = null;

            // 3秒后尝试重连

            setTimeout(() => this._initWebSocket(), 3000);

          };

        });

      },


      // 处理从服务端收到的消息
      _handleMessage(event) {

        try {

          const response = JSON.parse(event.data);

          console.log('收到服务端响应:', response);



          // 查找对应的回调函数

          const callback = this._callbacks.get(response.id);

          if (callback) {

            callback(response);

            this._callbacks.delete(response.id);

          }

        } catch (error) {

          console.error('处理消息错误:', error);

        }

      },

      // 生成唯一请求ID（修改这部分）
      _generateRequestId() {
        // 使用时间戳+随机数确保唯一性
        return Date.now().toString() + Math.floor(Math.random() * 1000).toString();
      },

      // 发送请求到服务端
      _sendRequest(action, params = {}) {
        return new Promise(async (resolve, reject) => {
          try {
            // 确保连接已建立
            await this._initWebSocket();

            // 生成唯一请求ID
            const requestId = this._generateRequestId();

            // 存储回调函数
            this._callbacks.set(requestId, (response) => {
              if (response.success) {
                resolve(response.data);
              } else {
                reject(new Error(response.error || '请求失败'));
              }
            });

            // 发送请求
            const request = {
              id: requestId,
              action: action,
              params: params
            };
            console.log('发送请求:', request);
            this._ws.send(JSON.stringify(request));
          } catch (error) {
            reject(error);
          }
        });
      },

      // 搜索视频的防抖实现
      searchVideos: function(searchTerm) {
        // 防抖功能：延迟执行搜索，取消之前的请求
        if (this._searchDebounceTimer) {
          clearTimeout(this._searchDebounceTimer);
        }

        // 创建唯一的搜索请求ID，用于取消旧请求
        const searchRequestId = Date.now().toString() + Math.random().toString(36).substr(2, 9);
        this._currentSearchId = searchRequestId;

        return new Promise((resolve, reject) => {
          this._searchDebounceTimer = setTimeout(async () => {
            try {
              // 检查当前请求是否仍为最新的请求
              if (this._currentSearchId !== searchRequestId) {
                // 如果不是最新的请求，则取消此请求
                reject(new Error('Search request cancelled due to new search'));
                return;
              }
              
              const result = await this._sendRequest('searchVideos', { query: searchTerm });
              
              // 再次检查，确保响应仍是针对最新的搜索请求
              if (this._currentSearchId === searchRequestId) {
                resolve(result);
              } else {
                reject(new Error('Search request cancelled due to new search'));
              }
            } catch (error) {
              // 只有当错误不是由于请求取消导致的，才真正拒绝
              if (error.message !== 'Search request cancelled due to new search') {
                reject(error);
              } else {
                // 请求被取消，返回空结果
                resolve([]);
              }
            }
          }, 300); // 300ms 防抖延迟
        });
      },

      // 添加搜索防抖定时器变量
      _searchDebounceTimer: null,
      _currentSearchId: null,

      // 标签相关接口

      // 载入标签列表

      getTags: function () { return flutterChannel._sendRequest('getTags'); },

      // 新增标签

      addTag: function (tagName) { return flutterChannel._sendRequest('createTag', { name: tagName }); },

      // 删除标签

      deleteTag: function (tagId) { return flutterChannel._sendRequest('deleteTag', { id: tagId }); },



            // 视频相关接口
      
            // 载入视频列表
      
            getVideos: function () { return flutterChannel._sendRequest('getVideos'); },
      
            // 获取最近上传的视频列表
            getRecentVideos: function (limit) { return flutterChannel._sendRequest('getRecentVideos', { limit: limit || 5 }); },
      
            // 获取视频播放链接
      
            getVideoUrl: function (videoId) { return flutterChannel._sendRequest('getVideoUrl', { videoId: videoId }); },
      
            // 获取视频大小
      
            getVideoSize: function (videoId) { return flutterChannel._sendRequest('getVideoSize', { videoId: videoId }); },
      
      // 删除视频

      deleteVideo: function (videoId) { return flutterChannel._sendRequest('deleteVideo', { id: videoId }); },

      // 获取视频缩略图

      getThumbnail: function (videoId) { return flutterChannel._sendRequest('getThumbnail', { videoId: videoId }); },

      // 更新视频信息

      updateVideo: function (video) { return flutterChannel._sendRequest('updateVideo', { video: video }); },
      // 分块上传二进制数据
      sendBinaryChunk: function (params) {

        return new Promise((resolve, reject) => {

          const requestId = flutterChannel._generateRequestId();

          let binarySent = false;



          // 发送块元数据

          const metaRequest = {

            id: requestId,

            action: 'uploadBinaryChunk',

            params: {

              fileId: params.fileId,

              chunkIndex: params.chunkIndex,

              totalChunks: params.totalChunks

            }

          };



          // 监听元数据响应

          const metaListener = (event) => {

            const response = JSON.parse(event.data);

            if (response.id === requestId && response.status === 'ready') {

              flutterChannel._ws.removeEventListener('message', metaListener);



              // 发送二进制数据

              params.blob.arrayBuffer().then(buffer => {

                flutterChannel._ws.send(buffer);

                binarySent = true;



                // 监听块确认

                const chunkListener = (event) => {

                  const chunkResponse = JSON.parse(event.data);

                  if (chunkResponse.id === requestId) {

                    flutterChannel._ws.removeEventListener('message', chunkListener);

                    if (chunkResponse.success) {

                      resolve(chunkResponse);

                    } else {

                      reject(new Error(chunkResponse.error));

                    }

                  }

                };

                flutterChannel._ws.addEventListener('message', chunkListener);

              });

            }

          };



          flutterChannel._ws.addEventListener('message', metaListener);

          flutterChannel._ws.send(JSON.stringify(metaRequest));



          // 超时处理

          setTimeout(() => {

            if (!binarySent) {

              flutterChannel._ws.removeEventListener('message', metaListener);

              reject(new Error('发送超时'));

            }

          }, 10000);

        });

      },

      // 完成二进制文件上传

      completeBinaryUpload: function (fileId, fileName, duration, tagIds, remark, title) {

        // const compressMode = document.querySelector('input[name="compress-mode"]:checked').value;

        return flutterChannel._sendRequest('completeBinaryUpload', {

          fileId,


          name: fileName,
          duration,
          tagIds,
          remark,
          fileSize: state.currentUploadFile.size,
          // compressMode: compressMode,
          title: title  // 新增title参数


        })
      },
    }
    // 状态管理
    const state = {
      videos: [],
      originalVideos: null, // 用于存储原始视频列表，搜索时使用
      tags: [],
      selectedTagIds: [],
      currentEditingVideo: null, // 当前正在编辑的视频
      selectedTagIdsForUpload: [], // 上传视频时选择的标签ID
      pendingUploads: new Map(), // 存储已上传但未合并的文件ID
      currentUploadFile: null, // 当前要上传的 文件
      currentFileId: null, // 当前要上传 文件的ID
      cancelUpload: false, // 是否正在执行缓存
      theme: localStorage.getItem('theme') || 'light', // 主题状态
    }

    // DOM元素引用

    // 优化：避免重复请求，对相同路径的缩略图进行缓存，减少重复请求
    const thumbnailCache = new Map();

    // 使用 localStorage 持久化缓存的缩略图
    function saveThumbnailToStorage(videoId, base64Data) {
      try {
        const cache = JSON.parse(localStorage.getItem('thumbnailStorage') || '{}');
        cache[videoId] = {
          data: base64Data,
          timestamp: Date.now(),
          expiry: Date.now() + (24 * 60 * 60 * 1000) // 24小时后过期
        };
        localStorage.setItem('thumbnailStorage', JSON.stringify(cache));
      } catch (e) {
        console.warn('无法保存缩略图到本地存储:', e);
      }
    }

    function getThumbnailFromStorage(videoId) {
      try {
        const cache = JSON.parse(localStorage.getItem('thumbnailStorage') || '{}');
        const item = cache[videoId];

        if (item && item.expiry > Date.now()) {
          return item.data;
        } else if (item) {
          // 删除过期的缩略图
          delete cache[videoId];
          localStorage.setItem('thumbnailStorage', JSON.stringify(cache));
        }
      } catch (e) {
        console.warn('无法从本地存储获取缩略图:', e);
      }
      return null;
    }

    // 渲染视频缩略图
    async function renderVideoThumbnail(video) {
      if (!video.id) {
        return '<i class="fa fa-film text-4xl text-gray-400"></i>';
      }

      // 检查内存缓存
      if (thumbnailCache.has(video.id)) {
        return thumbnailCache.get(video.id);
      }

      // 检查本地存储缓存
      const cachedBase64 = getThumbnailFromStorage(video.id);
      if (cachedBase64) {
        const imgHtml = `<img src="data:image/jpeg;base64,${cachedBase64}"
                    alt="${video.title}"
                    class="w-full h-full object-cover loading-lazy">`;
        thumbnailCache.set(video.id, imgHtml);
        return imgHtml;
      }

      try {
        // 获取Base64格式的缩略图
        const thumbnailData = await flutterChannel.getThumbnail(video.id);

        // 检查缩略图数据格式 - 兼容不同格式
        let base64Data = null;
        if (typeof thumbnailData === 'string') {
          // 如果直接返回字符串
          base64Data = thumbnailData;
        } else if (thumbnailData && typeof thumbnailData === 'object') {
          // 如果返回对象，尝试不同字段名
          base64Data = thumbnailData.base64 || thumbnailData.data || thumbnailData.thumbnail || thumbnailData;
        }

        if (!base64Data) {
          throw new Error('缩略图数据格式错误，无法获取base64数据');
        }

        const imgHtml = `<img src="data:image/jpeg;base64,${base64Data}"
                    alt="${video.title}"
                    class="w-full h-full object-cover loading-lazy">`;
        thumbnailCache.set(video.id, imgHtml);
        saveThumbnailToStorage(video.id, base64Data);
        return imgHtml;

      } catch (error) {
        console.error(`加载缩略图失败（视频ID: ${video.id}）:`, error);
        return '<i class="fa fa-film text-4xl text-gray-400"></i>';
      }
    }



    // 实现缩略图懒加载
    function initThumbnailLazyLoading() {
      // 使用 Intersection Observer 来实现更高效的懒加载
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const videoCard = entry.target;
              const videoId = videoCard.dataset.videoId;
              if (videoId) {
                // 可以在这里对即将进入视图的视频进行预加载
                // 但当前我们使用的是现有的缩略图函数
              }
              observer.unobserve(entry.target);
            }
          });
        }, {
          rootMargin: '100px' // 提前100px开始加载
        });

        // 观察所有视频卡片
        document.querySelectorAll('[data-video-id]').forEach(card => {
          observer.observe(card);
        });
      }
    }

    // 全局变量用于懒加载
    let currentFilteredVideos = [];
    let currentVideoIndex = 0;
    const videosPerPage = 20; // 每次加载的视频数量
    let isAllVideosLoaded = false;
    let isScrollLoading = false; // 防止重复加载

    // 渲染视频网格（更新为支持懒加载）
    async function renderVideoGrid() {
      // 重置懒加载状态
      currentVideoIndex = 0;
      isAllVideosLoaded = false;
      isScrollLoading = false;

      // 1. 应用标签筛选
      let filteredVideos = state.videos;

      if (state.selectedTagIds.length > 0) {
        filteredVideos = state.videos.filter(video =>
          state.selectedTagIds.every(tagId => video.tagIds.includes(tagId))
        );
      }

      // 2. 应用本地筛选（使用localeCompare避免中文问题）
      const filterTerm = elements.filterInput.value.trim();
      if (filterTerm) {
        const keywords = filterTerm.split(/\s+/).filter(k => k).map(k => k.toLowerCase());
        filteredVideos = filteredVideos.filter(video => {
          return keywords.every(keyword => {
            // 标题
            const matchTitle = video.title.toLocaleString().includes(keyword);
            // 标签
            const matchTag = video.tagIds.some(tagId => {
              const tag = state.tags.find(t => t.id === tagId);
              return tag && tag.name.toLowerCase().includes(keyword);
            });
            // 备注
            const matchRemark = video?.remark // 判断是否有remark
              ? video.remark.toLowerCase().includes(keyword) // 有的话常规筛选
              : false;

            return matchTitle || matchTag || matchRemark;
          })
        }) // filteredVideos
      } // if

      currentFilteredVideos = filteredVideos;

      // 3. 无匹配结果时的显示
      if (currentFilteredVideos.length === 0) {
        elements.videoGrid.innerHTML = `
          <div class="text-center text-gray-500 py-12">
            <i class="fa fa-search text-4xl mb-4"></i>
            <p>未找到匹配的视频</p>
          </div>
        `;
        // 移除滚动监听器，因为没有视频需要懒加载
        window.removeEventListener('scroll', handleScroll);
        return;
      }

      // 清空现有内容并加载第一批视频
      elements.videoGrid.innerHTML = '';
      await loadMoreVideos();

      // 绑定滚动事件以实现懒加载
      setupLazyLoading();

      // 更新视频计数显示
      if (currentFilteredVideos === state.videos) {
        // 显示总数（未筛选状态）
        updateVideoCount(currentFilteredVideos.length, false);
      } else {
        // 显示筛选后的数量
        updateVideoCount(currentFilteredVideos.length, true);
      }
    }

    // 设置懒加载滚动监听
    function setupLazyLoading() {
      // 移除之前的滚动监听器，避免重复绑定
      window.removeEventListener('scroll', handleScroll);
      window.addEventListener('scroll', handleScroll);
    }

    // 滚动事件处理函数
    function handleScroll() {
      // 检查是否已滚动到页面底部附近
      const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
      if (scrollTop + clientHeight >= scrollHeight - 500) { // 500px 触发提前加载
        if (!isAllVideosLoaded && !isScrollLoading) {
          loadMoreVideos();
        }
      }
    }

    // 加载更多视频
    async function loadMoreVideos() {
      if (isScrollLoading || isAllVideosLoaded) return;

      isScrollLoading = true;

      // 获取当前批次的视频
      const start = currentVideoIndex;
      const end = Math.min(currentVideoIndex + videosPerPage, currentFilteredVideos.length);
      const batchVideos = currentFilteredVideos.slice(start, end);

      // 如果没有更多视频，标记为全部加载完成
      if (batchVideos.length === 0) {
        isAllVideosLoaded = true;
        isScrollLoading = false;
        return;
      }

      // 生成并添加视频卡片
      const videoCards = await Promise.all(batchVideos.map(async (video) => {
        const thumbnailHtml = await renderVideoThumbnail(video);
        // 构建悬停提示文本，包含title和remark（如果存在）
        const tooltipText = video.remark ? `${video.title}\n${video.remark}` : video.title;
        return `
      <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-lg transition cursor-pointer dark:bg-gray-800 dark:text-white" data-video-id="${video.id}" title="${tooltipText}">
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-lg transition dark:bg-gray-800 dark:text-white">
          <div class="relative aspect-video bg-gray-100 dark:bg-gray-700">
            <div class="absolute bottom-2 right-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${formatFileSize(video.fileSize)}
            </div>
              ${thumbnailHtml}
            <!-- ↓ ↓ ↓ 视频卡片右上角 - 功能菜单 ↓ ↓ ↓ -->
            <div class="absolute top-2 right-2">
              <button class="menu-btn delete-menu-btn bg-black/50 text-white p-1 rounded-full" data-video-id="${video.id}">
                <i class="fa fa-ellipsis-v"></i>
              </button>
              <!-- 删除菜单 -->
              <div class="delete-menu hidden absolute right-0 mt-1 bg-white rounded-lg shadow-lg p-2 z-10 dark:bg-gray-700 dark:text-white">
                <button class="menu-item delete-video-btn text-red-500 hover:bg-gray-100 px-2 py-1 text-sm" data-video-id="${video.id}">
                  <i class="fa fa-trash mr-1 text-xl"></i>
                </button>
              </div>
            </div>
            <!-- ↑ ↑ ↑ 视频卡片右上角 - 功能菜单 ↑ ↑ ↑ -->
            <div class="absolute bottom-2 left-2 bg-black/70 text-white text-xs px-2 py-1 rounded">
              ${formatDuration(video.duration)}
            </div>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-gray-800 mb-1 truncate dark:text-gray-200" alt="${video.title}">${video.title}</h3>
            <div class="text-xs text-gray-500 mb-1 dark:text-gray-400">
              ${formatDate(video.uploadTime)}
            </div>
            <div class="flex flex-wrap gap-1 mb-2">
              ${video.tagIds.map(tagId => {
          const tag = state.tags.find(t => t.id === tagId);
          return tag ? `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full dark:bg-blue-900 dark:text-blue-100">${tag.name}</span>`
            :
            `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full dark:bg-blue-900 dark:text-blue-100">当前未有标签</span>`;
        }).join('')}
            </div>
          </div>
        </div>
      </div>
      `;
      }));

      // 添加新加载的视频到页面
      elements.videoGrid.insertAdjacentHTML('beforeend', videoCards.join(''));

      // 更新索引
      currentVideoIndex = end;

      // 检查是否已加载所有视频
      if (currentVideoIndex >= currentFilteredVideos.length) {
        isAllVideosLoaded = true;
      }

      isScrollLoading = false;

      // 初始化新添加的视频卡片的懒加载
      initThumbnailLazyLoading();
    }

      }

    // 缓存视频，预上传
    async function uploadBinary(fileId, videoFile) {
      try {
        elements.saveVideoBtn.disabled = true
        // 初始化上传
        await flutterChannel._sendRequest('initBinaryUpload', {
          fileId,
          fileName: videoFile.name,
          totalSize: videoFile.size,
          mimeType: videoFile.type
        });

        // 分块上传
        await uploadBinaryInChunks(fileId, videoFile, (progress) => {
          elements.progressBarTop.style.width = `${progress}%`;
          elements.progressBarBottom.style.width = `${progress}%`;
        });
        elements.saveVideoBtn.disabled = false
      } catch (errer) {

        alert(`预传失败: ${error.message || '未知错误'}`);
      }

    // 获取当前设备，以便优化上传分块大小
    function calcChunkSize(totalSize) {
      // { isMobile: 是否移动设备, isIPhoneSafari: 是否苹果手机Safari }
      const userAgent = navigator.userAgent.toLowerCase();
      const isMobile = /iphone|ipod|ipad|android|windows phone/.test(userAgent);
      const isIPhone = /iphone|ipod/.test(userAgent); // 仅匹配苹果手机（排除 iPad）
      const isSafari = /safari/.test(userAgent) && !/chrome|edge|firefox/.test(userAgent); // 纯 Safari（排除伪装 Safari 的浏览器）
      const isIPhoneSafari = isIPhone && isSafari;
      let chunkSize;

      // return {
      //   isMobile,
      //   isIPhoneSafari: isIPhone && isSafari
      // };
      if (isIPhoneSafari) {
        // 苹果手机 Safari 规则
        if (totalSize <= 25 * 1024 * 1024) { // ≤25MB
          chunkSize = 256 * 1024; // 256KB
        } else if (totalSize <= 50 * 1024 * 1024) { // 25MB~50MB
          chunkSize = 512 * 1024; // 512KB
        } else { // ＞50MB
          chunkSize = 1 * 1024 * 1024; // 1MB
        }
      } else {
        // 电脑浏览器规则（Chrome/Firefox/Edge/非Safari手机浏览器）
        if (totalSize <= 100 * 1024 * 1024) { // ≤100MB
          chunkSize = 1 * 1024 * 1024; // 1MB
        } else if (totalSize <= 500 * 1024 * 1024) { // 100MB~500MB
          chunkSize = 2 * 1024 * 1024; // 2MB
        } else { // ＞500MB
          chunkSize = 2 * 1024 * 1024; // 2MB
        }
      }
      return chunkSize
    }

    // 分块上传二进制视频文件
    async function uploadBinaryInChunks(fileId, videoFile, onProgress) {
      const totalSize = videoFile.size;
      const chunkSize = calcChunkSize(totalSize); // 256KB/块
      const totalChunks = Math.ceil(totalSize / chunkSize);

      for (let start = 0; start < totalSize; start += chunkSize) {
        if (state.cancelUpload) {
          sendCancelToBackend(fileId);
          return;
        }
        const end = Math.min(start + chunkSize, totalSize);
        const chunkBlob = videoFile.slice(start, end);
        const chunkIndex = Math.floor(start / chunkSize);

        try {
          // 发送二进制块
          await flutterChannel.sendBinaryChunk({
            fileId,
            chunkIndex,
            totalChunks,
            blob: chunkBlob
          });

          // 更新进度
          const progress = Math.floor((end / totalSize) * 100);
          onProgress(progress);

          // Safari兼容性延迟
          await new Promise(resolve => setTimeout(resolve, 50));
        } catch (error) {
          console.error(`块 ${chunkIndex} 上传失败:`, error);
          throw new Error(`上传失败，块索引: ${chunkIndex}`);
        }
      }
    }

    function sendCancelToBackend(fileId) {
      // 如果有已上传但未合并的文件，通知后端删除
      try {
        flutterChannel._sendRequest('cancelBinaryUpload', {
          fileId: fileId
        });
        state.pendingUploads.delete(state.currentFileId);
        console.log('分块上传任务已被取消，发送清空服务器缓存命令...')
      } catch (error) {
        console.error('取消上传失败:', error);
      }
    }

              state.currentEditingVideo.title !== elements.videoTitle.value.trim() ||
              (state.currentEditingVideo.remark || '') !== elements.videoRemark.value.trim() ||
              JSON.stringify(state.currentEditingVideo.tagIds) !== JSON.stringify(state.selectedTagIdsForUpload);

            if (hasChanges) {
              // 编辑模式下的确认对话框
              document.querySelector('#confirm-modal h3').textContent = '确认放弃编辑';
              document.querySelector('#confirm-modal p').textContent = '是否放弃当前编辑内容？';
              document.querySelector('#confirm-ok-btn').textContent = '放弃编辑';
              elements.confirmModal.classList.remove('hidden');
            } else {
              elements.uploadModal.classList.add('hidden');
              state.currentEditingVideo = null;
            }
          } else {
            // 非上传非编辑模式，直接关闭
            elements.uploadModal.classList.add('hidden');
          }
        }
      });

      elements.confirmModal.addEventListener('click', (e) => {
        if (e.target === elements.confirmModal) {
          elements.confirmModal.classList.add('hidden');
        }
      });

      // 浮框中添加标签按钮
      elements.addTagBtnModal.addEventListener('click', async () => {
        const tagName = elements.newTagInputModal.value.trim();
        if (tagName) {
          try {
            // 检查标签是否已存在
            const existingTag = state.tags.find(t => t.name.toLowerCase() === tagName.toLowerCase());
            if (existingTag) {
              // 已存在则直接选中
              if (!state.selectedTagIdsForUpload.includes(existingTag.id)) {
                state.selectedTagIdsForUpload.push(existingTag.id);
              }
              elements.newTagInputModal.value = '';
              renderTagSelection();
              return;
            }



            // 对不存在的标签进行添加
            const newTag = await flutterChannel.addTag(tagName);
            // 更新本地标签列表
            state.tags.push(newTag);
            state.selectedTagIdsForUpload.push(newTag.id);
            // 清空输入框
            elements.newTagInputModal.value = '';
            // 重新渲染标签选择区域
            renderTagSelection();
          } catch (error) {
            console.error('添加标签失败:', error);
            alert(`添加标签失败: ${error.message || '未知错误'}`);
          }
        }
      });

      // 浮框中按Enter键添加标签
      elements.newTagInputModal.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          elements.addTagBtnModal.click();
        }
      });

      // 为每个视频卡片的删除按钮事件做绑定
      document.querySelectorAll('.delete-menu-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const videoId = btn.dataset.videoId;
          document.querySelectorAll('.delete-menu').forEach(menu => {
            menu.classList.add('hidden');
          });
          btn.nextElementSibling.classList.toggle('hidden');
        });
      });

      // 点击页面其他区域隐藏所有删除菜单
      document.addEventListener('click', () => {
        document.querySelectorAll('.delete-menu').forEach(menu => {
          menu.classList.add('hidden');
        });
      })
    }

    // 工具函数：格式化时长
    function formatDuration(seconds) {
      if (!seconds) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 工具函数：格式化文件大小
    function formatFileSize(bytes) {
      if (bytes <= 0) return "0 B";
      const suffixes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return `${(bytes / Math.pow(1024, i)).toFixed(2)} ${suffixes[i]}`;
    }

    // 工具函数：格式化日期
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString();
    }

    // 工具函数：更新视频计数显示
    function updateVideoCount(count, isFiltered = false) {
      if (elements.videoCount) {
        if (isFiltered) {
          elements.videoCount.textContent = `(显示 ${count} 个视频)`;
          elements.videoCount.className = 'text-sm text-green-500 ml-2'; // 绿色表示筛选结果
        } else {
          elements.videoCount.textContent = `(共 ${count} 个视频)`;
          elements.videoCount.className = 'text-sm text-gray-500 ml-2'; // 灰色表示总数
        }
      }
    }

    // 工具函数：显示操作成功提示框
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', init);

    // 视频下载管理器 - 支持断点续传和分块下载
    class VideoDownloader {
      constructor(videoId, baseUrl, originalFileName = null) {
        this.videoId = videoId;
        this.baseUrl = baseUrl;
        this.videoUrl = `${baseUrl}/videoStream/${videoId}`;
        this.originalFileName = originalFileName; // 保存原始文件名
        this.chunks = new Map(); // 存储已下载的分块
        this.totalSize = 0;
        this.worker = null;
        this.isDownloading = false;
      }

      // 初始化下载 - 获取文件总大小
      async init() {
        try {
          // 1. 明确发送 HEAD 请求（仅要头信息）
          // console.log(`发送视频信息请求： ${this.videoUrl}`)
          //   const response = await fetch(this.videoUrl, {
          //     method: 'HEAD',
          //     mode: 'cors', // 显式指定跨域模式（内网也需要）
          //       credentials: 'omit', // 禁用凭证（避免跨域权限问题）
          //     headers: {
          //       'Origin': window.location.origin, // 显式声明请求源
          //       'Cache-Control': 'no-cache', // 禁用缓存
          //       'Pragma': 'no-cache',
          //       'Accept': '*/*', // 匹配后端 Content-Type
          //     },
          //   });

          // // const response = await fetch(this.videoUrl, { method: 'HEAD' });
          // if (!response.ok) throw new Error('获取文件信息失败');
          // console.log(response)
          // console.log(`response.headers： ${response.headers}`)
          // console.log(`response.status： ${response.status}`)
          // this.totalSize = parseInt(response.headers.get('Content-Length'));
          const fileSize = await flutterChannel.getVideoSize(this.videoId)
          this.totalSize = fileSize['videoSize']
          await this.loadCache(); // 加载缓存的分块
          return this.totalSize;
        } catch (error) {
          console.error('初始化下载失败:', error);
          throw error;
        }
      }

      // 从Cache API加载缓存的分块
      async loadCache() {
        if (!('caches' in window)) return;

        const cache = await caches.open(`video_${this.videoId}`);
        const keys = await cache.keys();

        for (const key of keys) {
          if (key.url.startsWith(this.videoUrl) && key.headers.get('Range')) {
            const range = key.headers.get('Range').match(/bytes=(\d+)-(\d*)/);
            if (range) {
              const start = parseInt(range[1]);
              const end = range[2] ? parseInt(range[2]) : this.totalSize - 1;
              const response = await cache.match(key);
              const blob = await response.blob();
              this.chunks.set(start, { end, blob });
            }
          }
        }
      }

      // 计算分块大小（根据设备类型）
      getChunkSize() {
        const userAgent = navigator.userAgent.toLowerCase();
        const isIPhoneSafari = /iphone|ipod/.test(userAgent) &&
          /safari/.test(userAgent) &&
          !/chrome|edge|firefox/.test(userAgent);

        if (isIPhoneSafari) {
          if (this.totalSize <= 25 * 1024 * 1024) return 256 * 1024; // 256KB
          if (this.totalSize <= 50 * 1024 * 1024) return 512 * 1024; // 512KB
          if (this.totalSize <= 100 * 1024 * 1024) return 1 * 1024 * 1024; // 1MB
          return 2 * 1024 * 1024; // 2MB
        } else {
          return this.totalSize <= 100 * 1024 * 1024 ? 5 * 1024 * 1024 : 10 * 1024 * 1024;
        }
      }

      // 开始下载
      startDownload(onProgress) {
        if (this.isDownloading) return;
        this.isDownloading = true;

        // 创建Web Worker处理分块下载
        this.worker = new Worker('download-worker.js');

        // 向Worker发送初始化信息
        this.worker.postMessage({
          type: 'init',
          videoUrl: this.videoUrl,
          totalSize: this.totalSize,
          chunkSize: this.getChunkSize(),
          cachedChunks: Array.from(this.chunks.entries()).map(([start, data]) => ({
            start,
            end: data.end
          })),
          isAndroidTablet: /android/.test(navigator.userAgent.toLowerCase()) &&
            screen.width >= 768
        });

        // 监听Worker消息
        this.worker.onmessage = (e) => {
          switch (e.data.type) {
            case 'progress':
              onProgress(e.data.progress);
              break;
            case 'chunk':
              this.saveChunk(e.data.start, e.data.end, e.data.blob);
              break;
            case 'complete':
              this.completeDownload();
              break;
            case 'error':
              console.error('下载错误:', e.data.error);
              this.isDownloading = false;
              break;
          }
        };
      }

      // 保存分块到缓存
      async saveChunk(start, end, blob) {
        this.chunks.set(start, { end, blob });

        // 保存到Cache API
        if ('caches' in window) {
          const cache = await caches.open(`video_${this.videoId}`);
          const request = new Request(this.videoUrl, {
            headers: { 'Range': `bytes=${start}-${end}` }
          });
          const response = new Response(blob, {
            status: 206,
            headers: {
              'Content-Range': `bytes ${start}-${end}/${this.totalSize}`,
              'Content-Type': 'application/octet-stream'
            }
          });
          await cache.put(request, response);
        }
      }

      // 完成下载并合并文件
      async completeDownload() {
        this.isDownloading = false;
        this.worker.terminate();

        // 按顺序合并分块
        const sortedChunks = Array.from(this.chunks.entries())
          .sort((a, b) => a[0] - b[0])
          .map(([_, data]) => data.blob);

        // 根据原始文件名确定MIME类型和扩展名
        let mimeType = 'video/mp4'; // 默认MIME类型
        let fileExtension = '.mp4'; // 默认扩展名
        if (this.originalFileName) {
          const ext = this.originalFileName.toLowerCase().split('.').pop();
          if (ext === 'mov') {
            mimeType = 'video/quicktime';
            fileExtension = '.mov';
          } else if (ext === 'mp4') {
            mimeType = 'video/mp4';
            fileExtension = '.mp4';
          } else if (ext === 'webm') {
            mimeType = 'video/webm';
            fileExtension = '.webm';
          } else if (ext === 'ogg') {
            mimeType = 'video/ogg';
            fileExtension = '.ogg';
          } else if (ext === 'avi') {
            mimeType = 'video/x-msvideo';
            fileExtension = '.avi';
          } else if (ext === 'wmv') {
            mimeType = 'video/x-ms-wmv';
            fileExtension = '.wmv';
          } else if (ext === 'flv') {
            mimeType = 'video/x-flv';
            fileExtension = '.flv';
          } else {
            fileExtension = '.' + ext; // 使用原始扩展名
          }
        }

        const videoBlob = new Blob(sortedChunks, { type: mimeType });
        const url = URL.createObjectURL(videoBlob);

        // 触发下载
        elements.downloadBtn.innerHTML = `<i class="fa fa-download mr-1"></i>下载完成`;
        const a = document.createElement('a');
        a.href = url;
        a.download = this.originalFileName || `video_${this.videoId}${fileExtension}`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          this.cleanupCache(); // 清理缓存
        }, 1000);
      }

      // 清理缓存
      async cleanupCache() {
        if ('caches' in window) {
          await caches.delete(`video_${this.videoId}`);
        }
      }

      // 取消下载
      cancel() {
        if (this.worker) {
          this.worker.terminate();
        }
        this.isDownloading = false;
      }
    }
  </script>
